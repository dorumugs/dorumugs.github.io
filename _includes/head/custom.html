<!-- start custom head snippets -->

<!-- Pretendard variable font (Korean-optimized sans) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<!-- insert favicons. use https://realfavicongenerator.net/ -->
{% if page.use_math %}
	{% include mathjax-support.html %}
{% endif %}


<link rel="apple-touch-icon" sizes="180x180" href="{{site.baseurl}}/assets/images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="{{site.baseurl}}/assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{site.baseurl}}/assets/images/favicon-16x16.png">
<link rel="manifest" href="{{site.baseurl}}/assets/images/site.webmanifest">
<link rel="mask-icon" href="{{site.baseurl}}/assets/images/safari-pinned-tab.svg" color="#5bbad5">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="theme-color" content="#ffffff">

<!-- Long unbreakable tokens (arrow-chains like a→b→c, long URLs) must wrap
     instead of pushing the page wider than the mobile viewport. -->
<style>
  .page__title, .page__title a { overflow-wrap: anywhere; word-break: break-word; }
  .page__content { overflow-wrap: break-word; }
</style>

<!-- Series group cards (collapsible) on listing pages -->
<style>
  /* Unified card look — single posts and series groups render as the SAME box
     in both grid (home) and list (archives) layouts. Series adds only a badge
     and an expand toggle to distinguish itself. */
  .entries-grid .grid__item > .archive__item,
  .entries-list .list__item > .archive__item,
  .series-group > summary {
    border: 1px solid #e6e6e6;
    border-radius: 6px;
    padding: 0.7em 0.95em;
    background: #fff;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .entries-grid .grid__item > .archive__item:hover,
  .entries-list .list__item > .archive__item:hover,
  .series-group > summary:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
    border-color: #cfd6dc;
  }
  /* give list-layout single cards clear separation between boxes */
  .entries-list .list__item { margin-bottom: 1em; }
  /* single-card title: match the series title tone (dark, no blue underline) */
  .entries-grid .grid__item > .archive__item .archive__item-title a,
  .entries-list .list__item > .archive__item .archive__item-title a {
    color: #2f3a44;
    text-decoration: none;
  }
  .entries-grid .grid__item > .archive__item .archive__item-title a:hover,
  .entries-list .list__item > .archive__item .archive__item-title a:hover {
    text-decoration: underline;
  }

  .series-group { position: relative; }
  .series-group, .series-group * { word-break: keep-all; overflow-wrap: anywhere; }
  .series-group > summary {
    cursor: pointer;
    list-style: none;
    display: block;
  }
  .series-group > summary::-webkit-details-marker { display: none; }
  .series-group[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }

  .series-group__teaser { margin-bottom: 0.6em; }
  .series-group__teaser img { border-radius: 4px; width: 100%; }
  .series-group__badge {
    display: inline-block;
    font-size: 0.7em;
    font-weight: 700;
    letter-spacing: .02em;
    color: #fff;
    background: #7a8b99;
    padding: 0.15em 0.55em;
    border-radius: 999px;
    vertical-align: middle;
    margin-right: 0.35em;
  }
  .series-group__body .archive__item-title { margin: 0.1em 0 0.25em; }
  .series-group__excerpt { margin: 0.15em 0 0.35em; font-size: 0.8em; color: #5b5b5b; }
  .series-group__meta { margin: 0; font-size: 0.72em; }
  .series-group__toggle { font-weight: 700; color: #4d6070; margin-right: 0.9em; }
  .series-group__toggle-close { display: none; }
  .series-group[open] .series-group__toggle-open { display: none; }
  .series-group[open] .series-group__toggle-close { display: inline; }

  .series-group__list {
    list-style: none;
    margin: 0;
    padding: 0.3em 0 0.2em;
    border: 1px solid #e6e6e6;
    border-top: none;
    border-radius: 0 0 6px 6px;
    background: #fff;
  }
  .series-group__list-item {
    display: flex;
    align-items: baseline;
    gap: 0.6em;
    padding: 0.4em 0.9em;
    border-top: 1px dashed #ededed;
  }
  .series-group__list-item:first-child { border-top: none; }
  .series-group__num {
    flex: 0 0 auto;
    width: 1.6em; height: 1.6em;
    line-height: 1.6em;
    text-align: center;
    font-size: 0.72em;
    font-weight: 700;
    color: #4d6070;
    background: #eef2f5;
    border-radius: 50%;
  }
  .series-group__list-item a { flex: 1 1 auto; font-size: 0.85em; }
  .series-group__list-date { flex: 0 0 auto; font-size: 0.72em; color: #9a9a9a; }
  /* Home uses a narrow multi-column grid; drop the secondary date there so the
     title gets the full column. Full-width list archives keep the date. */
  .grid__item .series-group__list-date { display: none; }

  @media (max-width: 600px) {
    .series-group__list-date { display: none; }
    .series-group__list-item { gap: 0.5em; padding: 0.4em 0.7em; }
  }
</style>

<!-- end custom head snippets -->
