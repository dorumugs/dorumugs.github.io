<!-- Long unbreakable tokens (arrow-chains like a→b→c, long URLs) must wrap
     instead of pushing the page wider than the mobile viewport. -->
<style>
  .page__title, .page__title a { overflow-wrap: anywhere; word-break: break-word; }
  .page__content { overflow-wrap: break-word; }
</style>

<!-- Series group cards (collapsible) on listing pages -->
<style>
  /* The theme already renders GRID cards as boxes
     (.entries-grid .grid__item .archive__item: border #e8e8e9, radius 12px,
     shadow, hover lift). Goal: series groups match that exact card, and
     LIST-layout single cards (which the theme leaves unboxed) get the same box —
     so single and series look identical in every layout. */

  /* Canonical card = theme's grid-card values. Applied to the series summary
     (both layouts) and to single cards in the list layout. */
  .series-group > summary,
  .entries-list .list__item > .archive__item:not(.series-group) {
    background: #fff;
    border: 1px solid #e8e8e9;
    border-radius: 12px;
    padding: 1.25rem 1.35rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .series-group > summary:hover,
  .entries-list .list__item > .archive__item:not(.series-group):hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    border-color: #cdcfd2;
  }

  /* In GRID the theme boxes the series <details> itself (it carries
     .archive__item) — that would double-frame the summary. Neutralise it;
     the box lives on the summary. */
  .entries-grid .grid__item > .archive__item.series-group {
    border: 0; padding: 0; background: none; box-shadow: none;
  }
  .entries-grid .grid__item > .archive__item.series-group:hover {
    transform: none; box-shadow: none;
  }

  /* list-layout cards need vertical separation */
  .entries-list .list__item { margin-bottom: 1.25rem; }

  /* card title tone: match the series title (dark text, not a blue underline) */
  .grid__item > .archive__item .archive__item-title a,
  .list__item > .archive__item .archive__item-title a {
    color: inherit;
    text-decoration: none;
  }
  .grid__item > .archive__item .archive__item-title a:hover,
  .list__item > .archive__item .archive__item-title a:hover {
    text-decoration: underline;
  }

  .series-group { position: relative; }
  .series-group, .series-group * { word-break: keep-all; overflow-wrap: anywhere; }
  .series-group > summary {
    cursor: pointer;
    list-style: none;
    display: block;
  }
  .series-group > summary::-webkit-details-marker { display: none; }
  .series-group[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }

  .series-group__teaser { margin-bottom: 0.6em; }
  .series-group__teaser img { border-radius: 4px; width: 100%; }
  .series-group__badge {
    display: inline-block;
    font-size: 0.7em;
    font-weight: 700;
    letter-spacing: .02em;
    color: #fff;
    background: #7a8b99;
    padding: 0.15em 0.55em;
    border-radius: 999px;
    vertical-align: middle;
    margin-right: 0.35em;
  }
  .series-group__badge-row { margin: 0 0 0.4em; }
  .series-group__body .archive__item-title { margin: 0.1em 0 0.2em; }
  .series-group__excerpt { margin: 0.15em 0 0.35em; font-size: 0.8em; color: #5b5b5b; }
  .series-group__meta { margin: 0 0 0.3em; font-size: 0.72em; }
  .series-group__toggle-row { margin: 0.55rem 0 0; font-size: 0.75em; }
  .series-group__toggle { font-weight: 700; color: #4d6070; }
  .series-group__toggle-close { display: none; }
  .series-group[open] .series-group__toggle-open { display: none; }
  .series-group[open] .series-group__toggle-close { display: inline; }

  /* Home grid: each card sizes to its own content (full excerpt/title shown) and
     stays independent. align-items:start + height:auto keep a card from
     stretching when a neighbouring series card is expanded — so opening one
     group never grows the cards beside or below it. */
  .entries-grid { align-items: start; }
  .entries-grid .grid__item > .archive__item,
  .entries-grid .grid__item .series-group > summary { height: auto; }

  .series-group__list {
    list-style: none;
    margin: 0;
    padding: 0.3em 0 0.2em;
    border: 1px solid #e8e8e9;
    border-top: none;
    border-radius: 0 0 12px 12px;
    background: #fff;
  }
  .series-group__list-item {
    display: flex;
    align-items: baseline;
    gap: 0.6em;
    padding: 0.4em 0.9em;
    border-top: 1px dashed #ededed;
  }
  .series-group__list-item:first-child { border-top: none; }
  .series-group__num {
    flex: 0 0 auto;
    width: 1.6em; height: 1.6em;
    line-height: 1.6em;
    text-align: center;
    font-size: 0.72em;
    font-weight: 700;
    color: #4d6070;
    background: #eef2f5;
    border-radius: 50%;
  }
  .series-group__list-item a { flex: 1 1 auto; font-size: 0.85em; }
  .series-group__list-date { flex: 0 0 auto; font-size: 0.72em; color: #9a9a9a; }
  /* Home uses a narrow multi-column grid; drop the secondary date there so the
     title gets the full column. Full-width list archives keep the date. */
  .grid__item .series-group__list-date { display: none; }

  @media (max-width: 600px) {
    .series-group__list-date { display: none; }
    .series-group__list-item { gap: 0.5em; padding: 0.4em 0.7em; }
  }
</style>

<!-- end custom head snippets -->
