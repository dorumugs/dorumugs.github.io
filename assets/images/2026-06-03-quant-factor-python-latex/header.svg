<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="PER RSI MACD Sharpe 팩터를 수식과 pandas 로 직접 계산하는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6264a7"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0a7c8c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">퀀트 팩터 직접 계산</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">PER · RSI · MACD · Bollinger · Sharpe — 정의식부터 pandas 구현까지</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#b3b4e6">수식 정의</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">LaTeX 기호 읽는 법부터</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1e1633" stroke="#7c3aed" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#c4b5fd">pandas 구현</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">라이브러리 없이 직접</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#5ec6d6">해석 · 함정</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">숫자를 읽는 기준까지</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 퀀트 팩터를 정의식부터 차근차근</text>
</svg>
