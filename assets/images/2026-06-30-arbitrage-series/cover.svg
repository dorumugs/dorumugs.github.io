<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="0.5" stop-color="#13182b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- title row -->
  <text x="60" y="62" fill="#e2e8f0" font-size="37" font-weight="700">개인 차익거래 — 세후로 끝까지</text>
  <text x="62" y="98" fill="#94a3b8" font-size="19" font-weight="500">4부작 · 스프레드에서 무엇을 빼야 진짜 수익이 남는가</text>
  <text x="1140" y="60" fill="#64748b" font-size="16" text-anchor="end">KayserDocs · 2026</text>
  <line x1="60" y1="118" x2="1140" y2="118" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ===== Card 1 : 개요 (cyan/gold) ===== -->
  <g>
    <rect x="60" y="140" width="252" height="186" rx="14" fill="#0b1220" stroke="#1e4257" stroke-width="1.5"/>
    <circle cx="92" cy="174" r="16" fill="#38bdf8"/>
    <text x="92" y="180" fill="#04222e" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <text x="120" y="180" fill="#e2e8f0" font-size="19" font-weight="700">개요 · 유형 지도</text>
    <!-- glyph : two markets + spread -->
    <line x1="92" y1="270" x2="280" y2="270" stroke="#334155" stroke-width="1.5"/>
    <rect x="118" y="236" width="34" height="34" rx="3" fill="#38bdf8"/>
    <rect x="210" y="220" width="34" height="50" rx="3" fill="#fbbf24"/>
    <rect x="158" y="232" width="46" height="20" rx="10" fill="#10b981"/>
    <text x="181" y="246" fill="#052e1f" font-size="11" font-weight="700" text-anchor="middle">+spread</text>
    <text x="186" y="312" fill="#7dd3fc" font-size="14" text-anchor="middle">6가지 유형 한눈에</text>
  </g>

  <!-- ===== Card 2 : 배당락 (red waterfall) ===== -->
  <g>
    <rect x="335" y="140" width="252" height="186" rx="14" fill="#0b1220" stroke="#5b2330" stroke-width="1.5"/>
    <circle cx="367" cy="174" r="16" fill="#f87171"/>
    <text x="367" y="180" fill="#2c0a0e" font-size="17" font-weight="700" text-anchor="middle">2</text>
    <text x="395" y="180" fill="#e2e8f0" font-size="19" font-weight="700">배당락 · 세금</text>
    <!-- glyph : waterfall down -->
    <line x1="367" y1="248" x2="560" y2="248" stroke="#475569" stroke-width="1.2" stroke-dasharray="2 4"/>
    <rect x="378" y="218" width="30" height="30" rx="2" fill="#34d399"/>
    <rect x="418" y="218" width="30" height="10" rx="2" fill="#f87171"/>
    <rect x="458" y="228" width="30" height="40" rx="2" fill="#ef4444"/>
    <rect x="520" y="248" width="30" height="20" rx="2" fill="#b91c1c"/>
    <text x="463" y="312" fill="#fca5a5" font-size="14" text-anchor="middle">세후 거의 마이너스</text>
  </g>

  <!-- ===== Card 3 : ETF 괴리 (teal) ===== -->
  <g>
    <rect x="610" y="140" width="252" height="186" rx="14" fill="#0b1220" stroke="#164e5a" stroke-width="1.5"/>
    <circle cx="642" cy="174" r="16" fill="#22d3ee"/>
    <text x="642" y="180" fill="#042b30" font-size="17" font-weight="700" text-anchor="middle">3</text>
    <text x="670" y="180" fill="#e2e8f0" font-size="19" font-weight="700">ETF 괴리 · 실행</text>
    <!-- glyph : price dipping below NAV then converging -->
    <line x1="635" y1="240" x2="838" y2="240" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
    <polyline points="640,240 670,244 700,262 720,274 750,256 790,242 838,240"
              fill="none" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="720" cy="274" r="4.5" fill="#22d3ee"/>
    <text x="736" y="312" fill="#67e8f9" font-size="14" text-anchor="middle">수렴하면 플러스</text>
  </g>

  <!-- ===== Card 4 : 김프 (rose, wall) ===== -->
  <g>
    <rect x="885" y="140" width="252" height="186" rx="14" fill="#0b1220" stroke="#5b1f2c" stroke-width="1.5"/>
    <circle cx="917" cy="174" r="16" fill="#fb7185"/>
    <text x="917" y="180" fill="#2c0a12" font-size="17" font-weight="700" text-anchor="middle">4</text>
    <text x="945" y="180" fill="#e2e8f0" font-size="19" font-weight="700">김프 · 규제</text>
    <!-- glyph : low bar | wall | high bar -->
    <line x1="917" y1="270" x2="1110" y2="270" stroke="#334155" stroke-width="1.5"/>
    <rect x="930" y="240" width="34" height="30" rx="3" fill="#60a5fa"/>
    <rect x="1076" y="216" width="34" height="54" rx="3" fill="#fb7185"/>
    <rect x="998" y="206" width="44" height="64" rx="6" fill="#f43f5e" fill-opacity="0.14"
          stroke="#9f1239" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="1020" y="244" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">벽</text>
    <text x="1018" y="312" fill="#fda4af" font-size="14" text-anchor="middle">규제가 결론</text>
  </g>
</svg>
