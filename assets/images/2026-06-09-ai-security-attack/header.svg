<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="인가된 모의침투에 생성형 AI를 붙이는 공격 관점 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="0.5" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">AI 모의침투 자동화 <tspan fill="#f87171">(1/4)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">인가된 pentest·CTF 에 생성형 AI 붙이기 — 정찰·취약점·페이로드</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a0e0e" stroke="#dc2626" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#f87171">정찰 요약</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">스캔결과 압축·우선순위</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a0e0e" stroke="#ef4444" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fca5a5">취약점 리뷰</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">SAST 보조 코드리뷰</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a0e0e" stroke="#f87171" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fecaca">페이로드 해석</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">난독화 스크립트 해설</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 인가된 모의침투에 붙이는 생성형 AI</text>
</svg>
