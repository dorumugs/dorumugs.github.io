<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="ta 와 TA-Lib 라이브러리로 퀀트 지표를 한 줄에 뽑는 입문 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7c8c"/>
      <stop offset="0.5" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">ta · TA-Lib 퀀트 지표 입문</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">RSI · MACD · Bollinger · ATR 을 한 줄로 — 설치 함정과 값 차이까지</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#5ec6d6">ta</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">pip 한 방 · pandas 친화</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0c2733" stroke="#0891b2" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#67e8f9">TA-Lib</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">C 코어 · 150+ 지표</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#101c33" stroke="#2563eb" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#93c5fd">값 검증</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">Wilder smoothing 차이</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 퀀트 지표 라이브러리 입문</text>
