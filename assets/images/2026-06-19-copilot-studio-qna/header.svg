<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Copilot Studio 사내 규정 Q&A 봇 핸즈온 배너 — 지식에서 게시까지">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7c8c"/>
      <stop offset="0.5" stop-color="#6264a7"/>
      <stop offset="1" stop-color="#217346"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="48" font-weight="800" fill="#f8fafc">사내 규정 <tspan fill="#5ec6d6">Q&amp;A 봇</tspan> 직접 만들기</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">Copilot Studio 핸즈온 — 지식 연결부터 게시까지</text>

  <!-- pipeline: 지식 → 에이전트(검색·인용) → 게시 -->
  <g class="ko" text-anchor="middle">
    <!-- 지식 -->
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#5ec6d6">지식</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">SharePoint · 사내 위키 문서</text>

    <!-- 에이전트 -->
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#b3b4e6">에이전트</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">규정 검색 · 출처 인용</text>

    <!-- 게시 -->
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7dd3a8">게시</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">Teams · Copilot Chat</text>
  </g>

  <!-- arrows -->
  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 권한 안의 규정 문서만 보고, 출처를 달아 답하는 봇</text>
</svg>
