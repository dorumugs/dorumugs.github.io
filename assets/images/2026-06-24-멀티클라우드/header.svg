<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="g" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>

  <text x="60" y="74" fill="#f8fafc" font-size="40" font-weight="800">멀티 클라우드로 넓히기</text>
  <text x="60" y="112" fill="#94a3b8" font-size="21" font-weight="500">클라우드가 여럿이면 신원·정책·가시성이 쪼개진다 — 한 겹 위에서 묶기</text>

  <!-- common plane across clouds -->
  <rect x="70" y="175" width="1060" height="52" rx="13" fill="url(#plane)" opacity="0.9"/>
  <text x="600" y="208" fill="#f8fafc" font-size="17" font-weight="800" text-anchor="middle">공통 신원(SPIFFE) · 정책(GitOps) · 가시성(중앙 수집) 레이어</text>

  <!-- three clouds -->
  <g>
    <rect x="90" y="260" width="300" height="135" rx="16" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="240" y="292" fill="#e0f2fe" font-size="17" font-weight="700" text-anchor="middle">클라우드 A</text>
    <text x="240" y="320" fill="#7dd3fc" font-size="13" text-anchor="middle">자체 IAM · 네트워크 · KMS</text>
    <circle cx="185" cy="358" r="18" fill="#075985" stroke="#7dd3fc"/>
    <circle cx="295" cy="358" r="18" fill="#075985" stroke="#7dd3fc"/>
    <path d="M 203 358 L 277 358" stroke="#34d399" stroke-width="2.2" marker-end="url(#g)"/>
  </g>
  <g>
    <rect x="450" y="260" width="300" height="135" rx="16" fill="#3730a3" stroke="#818cf8" stroke-width="1.6"/>
    <text x="600" y="292" fill="#e0e7ff" font-size="17" font-weight="700" text-anchor="middle">클라우드 B</text>
    <text x="600" y="320" fill="#a5b4fc" font-size="13" text-anchor="middle">자체 IAM · 네트워크 · KMS</text>
    <circle cx="545" cy="358" r="18" fill="#312e81" stroke="#a5b4fc"/>
    <circle cx="655" cy="358" r="18" fill="#312e81" stroke="#a5b4fc"/>
    <path d="M 563 358 L 637 358" stroke="#34d399" stroke-width="2.2" marker-end="url(#g)"/>
  </g>
  <g>
    <rect x="810" y="260" width="300" height="135" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="1.6"/>
    <text x="960" y="292" fill="#d1fae5" font-size="17" font-weight="700" text-anchor="middle">클라우드 C</text>
    <text x="960" y="320" fill="#6ee7b7" font-size="13" text-anchor="middle">자체 IAM · 네트워크 · KMS</text>
    <circle cx="905" cy="358" r="18" fill="#065f46" stroke="#6ee7b7"/>
    <circle cx="1015" cy="358" r="18" fill="#065f46" stroke="#6ee7b7"/>
    <path d="M 923 358 L 997 358" stroke="#34d399" stroke-width="2.2" marker-end="url(#g)"/>
  </g>

  <!-- federation links between clouds -->
  <path d="M 390 327 L 450 327" stroke="#fbbf24" stroke-width="2.4" stroke-dasharray="5 4"/>
  <path d="M 750 327 L 810 327" stroke="#fbbf24" stroke-width="2.4" stroke-dasharray="5 4"/>
  <text x="600" y="430" fill="#fcd34d" font-size="13" text-anchor="middle">trust bundle 로 클라우드 간 신원 연합 · 정책은 클라우드 중립으로</text>

  <text x="600" y="462" fill="#cbd5e1" font-size="14.5" text-anchor="middle">그 위에 금융 규제: 금융보안원 CSP 안전성 평가 · 중요업무 구분 · 이용보고</text>
</svg>
