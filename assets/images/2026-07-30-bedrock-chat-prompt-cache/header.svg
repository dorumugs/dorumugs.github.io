<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="프롬프트 캐싱의 prefix 일치 구조 — tools, system, 이전 턴은 캐시에서 읽고 마지막 턴만 새로 계산하는 구조 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="104" font-size="41" font-weight="800" fill="#f8fafc">프롬프트 캐싱 — <tspan fill="#22c55e">prefix 가 전부</tspan></text>
  <text class="ko" x="82" y="148" font-size="22" font-weight="500" fill="#94a3b8">앞부분 한 바이트만 바뀌면 그 뒤 캐시는 전부 무효가 돼요.</text>

  <g class="ko">
    <text x="80" y="212" font-size="16" font-weight="700" fill="#64748b">렌더 순서</text>

    <rect x="80"  y="228" width="200" height="86" rx="12" fill="#0f2a22" stroke="#22c55e" stroke-width="3"/>
    <text x="180" y="264" font-size="19" font-weight="800" fill="#86efac" text-anchor="middle">tools</text>
    <text x="180" y="292" font-size="14" font-weight="500" fill="#cbd5e1" text-anchor="middle">캐시 읽기</text>

    <rect x="288" y="228" width="228" height="86" rx="12" fill="#0f2a22" stroke="#22c55e" stroke-width="3"/>
    <text x="402" y="264" font-size="19" font-weight="800" fill="#86efac" text-anchor="middle">system</text>
    <text x="402" y="292" font-size="14" font-weight="500" fill="#cbd5e1" text-anchor="middle">캐시 읽기</text>

    <rect x="524" y="228" width="336" height="86" rx="12" fill="#0f2a22" stroke="#22c55e" stroke-width="3"/>
    <text x="692" y="264" font-size="19" font-weight="800" fill="#86efac" text-anchor="middle">이전 턴 히스토리</text>
    <text x="692" y="292" font-size="14" font-weight="500" fill="#cbd5e1" text-anchor="middle">캐시 읽기 · 원가의 10분의 1</text>

    <rect x="868" y="228" width="252" height="86" rx="12" fill="#3a1d24" stroke="#fb7185" stroke-width="3"/>
    <text x="994" y="264" font-size="19" font-weight="800" fill="#fda4af" text-anchor="middle">이번 질문</text>
    <text x="994" y="292" font-size="14" font-weight="500" fill="#cbd5e1" text-anchor="middle">새로 계산 · 제값</text>
  </g>

  <text class="ko" x="80" y="356" font-size="17" font-weight="700" fill="#a78bfa">cache_control 은 “재사용할 구간이 끝나는 곳”에 붙입니다 — 요청당 최대 4개</text>
  <text class="ko" x="80" y="392" font-size="16" font-weight="500" fill="#475569">Bedrock 은 자동 캐싱 미지원 · 시스템 프롬프트에 시각·세션ID 를 끼우면 캐시가 조용히 죽어요</text>
</svg>
