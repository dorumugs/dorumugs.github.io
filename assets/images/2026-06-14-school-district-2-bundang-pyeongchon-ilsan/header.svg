<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="1기 신도시 학군 분당·평촌·일산의 학원가 단지 실거래 비교 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="0.5" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">1기 신도시 학군 <tspan fill="#fdba74">(2/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">분당·평촌·일산 — 계획도시에 처음부터 깔린 학원가와 단지</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2b1508" stroke="#c2410c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fdba74">분당</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">서현·수내·정자</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#301708" stroke="#ea580c" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fec89a">평촌</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">범계 귀인마을</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#33190a" stroke="#fb923c" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fed7aa">일산</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">후곡·강선 학원가</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 학군지 시리즈 2/3</text>
</svg>
