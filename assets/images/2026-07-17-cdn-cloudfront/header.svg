<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="원본 서버 하나를 전 세계 엣지 로케이션이 캐싱해 사용자에게 가까이서 전달하는 CDN·CloudFront 구성 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12233d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="44" font-weight="800" fill="#f8fafc">CDN 이 뭐길래 — <tspan fill="#38bdf8">CloudFront</tspan> 까지</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">원본은 하나, 캐시는 전 세계 엣지에 — 가까운 곳에서 빠르게 서빙하기</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="240" height="118" rx="16" fill="#132a1c" stroke="#f59e0b" stroke-width="3"/>
    <text x="210" y="282" font-size="22" font-weight="800" fill="#fbbf24">Origin</text>
    <text x="210" y="314" font-size="16" font-weight="500" fill="#cbd5e1">원본 서버 · S3 · ALB</text>

    <rect x="450" y="236" width="300" height="118" rx="16" fill="#0f2137" stroke="#38bdf8" stroke-width="3"/>
    <text x="600" y="282" font-size="22" font-weight="800" fill="#7dd3fc">Edge 캐시</text>
    <text x="600" y="314" font-size="16" font-weight="500" fill="#cbd5e1">CloudFront 엣지 로케이션</text>

    <rect x="870" y="236" width="240" height="118" rx="16" fill="#101a2e" stroke="#1d4ed8" stroke-width="3"/>
    <text x="990" y="282" font-size="22" font-weight="800" fill="#93c5fd">사용자</text>
    <text x="990" y="314" font-size="16" font-weight="500" fill="#cbd5e1">전 세계 · 가장 가까운 엣지</text>
  </g>

  <line x1="335" y1="295" x2="443" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="755" y1="295" x2="863" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 원본 하나를 전 세계로 빠르게 뿌리기</text>
</svg>
