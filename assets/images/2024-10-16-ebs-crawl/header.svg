<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="EBS Power English 강의 PDF 를 자동 수집하는 크롤러 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">EBS Power English <tspan fill="#6ee7b7">PDF 자동 수집</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">Selenium 로그인 + BS4 파싱으로 강의 자료 1250개 내려받기</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0f2a20" stroke="#10b981" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#6ee7b7">Selenium</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">네이버·EBS 로그인</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0c2434" stroke="#0ea5e9" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#7dd3fc">BS4 + 쿠키</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">세션 재사용 파싱</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a2010" stroke="#f59e0b" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fbbf24">PDF 1250개</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">자동 다운로드</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 크롤링 자동화 프로젝트</text>
</svg>
