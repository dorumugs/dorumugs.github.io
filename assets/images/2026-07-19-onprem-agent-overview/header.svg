<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="코딩 에이전트를 모델·서빙·하네스 3층으로 분해해 클라우드에서 사내 GPU 로 옮기는 온프렘 전환 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101d33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="108" font-size="43" font-weight="800" fill="#f8fafc">Claude Code·Codex 를 <tspan fill="#22c55e">온프렘</tspan>으로</text>
  <text class="ko" x="82" y="152" font-size="23" font-weight="500" fill="#94a3b8">모델 · 서빙 · 하네스 3층으로 분해하고, 손익분기에서 갈아끼우기</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="232" width="320" height="120" rx="16" fill="#101a2e" stroke="#6366f1" stroke-width="3"/>
    <text x="250" y="278" font-size="22" font-weight="800" fill="#a5b4fc">모델</text>
    <text x="250" y="312" font-size="16" font-weight="500" fill="#cbd5e1">오픈웨이트 가중치 (두뇌)</text>

    <rect x="440" y="232" width="320" height="120" rx="16" fill="#0f2137" stroke="#38bdf8" stroke-width="3"/>
    <text x="600" y="278" font-size="22" font-weight="800" fill="#7dd3fc">서빙</text>
    <text x="600" y="312" font-size="16" font-weight="500" fill="#cbd5e1">vLLM · OpenAI 호환 API</text>

    <rect x="790" y="232" width="320" height="120" rx="16" fill="#12241c" stroke="#22c55e" stroke-width="3"/>
    <text x="950" y="278" font-size="22" font-weight="800" fill="#86efac">하네스</text>
    <text x="950" y="312" font-size="16" font-weight="500" fill="#cbd5e1">오픈 에이전트 CLI (손발)</text>
  </g>

  <line x1="412" y1="292" x2="438" y2="292" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="762" y1="292" x2="788" y2="292" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 토큰당 한계비용을 0 으로, 데이터는 사내로</text>
</svg>
