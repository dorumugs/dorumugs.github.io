<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="백엔드 없이 S3 쓰기 경로에 접근 제한을 걸어 권한 있는 사람만 저장하게 하는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#2a1c10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="43" font-weight="800" fill="#f8fafc">누가 <tspan fill="#fbbf24">저장</tspan>할 수 있는지 잠그기</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">읽기는 열고, 쓰기 경로만 접근 제한 — 네트워크·엣지·임시자격</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="260" height="118" rx="16" fill="#231a0e" stroke="#b45309" stroke-width="3"/>
    <text x="220" y="280" font-size="21" font-weight="800" fill="#fbbf24">읽기 / 쓰기 분리</text>
    <text x="220" y="312" font-size="16" font-weight="500" fill="#cbd5e1">GET 공개 · PUT 잠금</text>
    <rect x="470" y="236" width="260" height="118" rx="16" fill="#231a0e" stroke="#b45309" stroke-width="3"/>
    <text x="600" y="280" font-size="21" font-weight="800" fill="#fbbf24">쓰기 경로 문지기</text>
    <text x="600" y="312" font-size="16" font-weight="500" fill="#cbd5e1">IP · 엣지토큰 · 로그인</text>
    <rect x="850" y="236" width="260" height="118" rx="16" fill="#0d2321" stroke="#0d9488" stroke-width="3"/>
    <text x="980" y="280" font-size="21" font-weight="800" fill="#5eead4">권한 있는 사람만</text>
    <text x="980" y="312" font-size="16" font-weight="500" fill="#cbd5e1">PUT 성공 · 감사 기록</text>
  </g>

  <line x1="355" y1="295" x2="463" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="735" y1="295" x2="843" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 백엔드 없이 동시 편집 지키기 (3·끝)</text>
</svg>
