<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="25억 이상 똘똘한 한 채, 갈아타기 사다리의 꼭대기 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">25억+, 똘똘한 한 채 <tspan fill="#c4b5fd">(5/5)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">잠실·반포·강남·용산·여의도·성수 — 갈아타기 사다리의 꼭대기</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#221741" stroke="#7c3aed" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#c4b5fd">최상급 대장</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">잠실·반포·강남·용산</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#251a4a" stroke="#8b5cf6" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#d0c3fe">비쌀수록 강세</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">핵심지 수요 집중</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#281d50" stroke="#a78bfa" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#ddd6fe">한 채 전략</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">세금이 가르는 선택</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 입지 갈아타기 로드맵 5/5</text>
</svg>
