<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Marquez 의 계보·품질 신호를 모아 매일 Slack 으로 데이터 품질 리포트를 자동 발행하는 구성 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7c8c"/>
      <stop offset="0.5" stop-color="#6264a7"/>
      <stop offset="1" stop-color="#217346"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">품질 리포트 <tspan fill="#5ec6d6">자동화</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">계보·품질 신호를 모아 매일 Slack 으로 — "어디가 언제부터 깨졌나"</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#7dd3a8">Marquez</text>
    <text x="215" y="320" font-size="15" font-weight="500" fill="#cbd5e1">계보 + 품질 facet</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="288" font-size="22" font-weight="800" fill="#b3b4e6">리포트 DAG</text>
    <text x="600" y="320" font-size="15" font-weight="500" fill="#cbd5e1">실패 단언 수집</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#5ec6d6">Slack</text>
    <text x="985" y="320" font-size="15" font-weight="500" fill="#cbd5e1">매일 다이제스트</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Airflow data quality report</text>
</svg>
