<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="컨텍스트가 꽉 찰 때 오래된 히스토리를 자르기, 정리, 압축 요약, 장기 기억으로 줄이는 네 가지 방법 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="104" font-size="41" font-weight="800" fill="#f8fafc">컨텍스트가 꽉 찰 때 — <tspan fill="#fbbf24">줄이는 네 가지</tspan></text>
  <text class="ko" x="82" y="148" font-size="22" font-weight="500" fill="#94a3b8">창이 차기 전에 비용과 지연이 먼저 아파옵니다.</text>

  <g class="ko" text-anchor="middle">
    <rect x="70"  y="222" width="248" height="124" rx="16" fill="#10233a" stroke="#38bdf8" stroke-width="3"/>
    <text x="194" y="264" font-size="20" font-weight="800" fill="#7dd3fc">자르기</text>
    <text x="194" y="294" font-size="15" font-weight="500" fill="#cbd5e1">최근 N 턴만 남김</text>
    <text x="194" y="320" font-size="14" font-weight="500" fill="#64748b">가장 쉽고 가장 잘 잊음</text>

    <rect x="348" y="222" width="248" height="124" rx="16" fill="#1b1a33" stroke="#818cf8" stroke-width="3"/>
    <text x="472" y="264" font-size="20" font-weight="800" fill="#a5b4fc">정리</text>
    <text x="472" y="294" font-size="15" font-weight="500" fill="#cbd5e1">낡은 툴 결과 비우기</text>
    <text x="472" y="320" font-size="14" font-weight="500" fill="#64748b">context editing (베타)</text>

    <rect x="626" y="222" width="248" height="124" rx="16" fill="#3a2e12" stroke="#fbbf24" stroke-width="3"/>
    <text x="750" y="264" font-size="20" font-weight="800" fill="#fcd34d">압축</text>
    <text x="750" y="294" font-size="15" font-weight="500" fill="#cbd5e1">서버가 요약해 접기</text>
    <text x="750" y="320" font-size="14" font-weight="500" fill="#64748b">compaction (베타)</text>

    <rect x="904" y="222" width="226" height="124" rx="16" fill="#0f2a22" stroke="#22c55e" stroke-width="3"/>
    <text x="1017" y="264" font-size="20" font-weight="800" fill="#86efac">장기 기억</text>
    <text x="1017" y="294" font-size="15" font-weight="500" fill="#cbd5e1">밖에 두고 꺼내 쓰기</text>
    <text x="1017" y="320" font-size="14" font-weight="500" fill="#64748b">요약 카드 · 검색</text>
  </g>

  <text class="ko" x="80" y="392" font-size="16" font-weight="500" fill="#475569">압축 블록은 응답 content 를 통째로 다시 넣어야 살아남습니다 — 텍스트만 뽑으면 상태가 사라져요</text>
</svg>
