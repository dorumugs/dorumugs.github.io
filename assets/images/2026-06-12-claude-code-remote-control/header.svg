<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="폰과 브라우저에서 내 PC 의 Claude Code 세션을 이어받는 Remote Control 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7c8c"/>
      <stop offset="0.5" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#2563a8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">Claude Code Remote Control <tspan fill="#5ec6d6">(1/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">내 PC 에서 도는 세션을 폰·태블릿·브라우저에서 그대로 이어받아 조종</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#5ec6d6">서버 모드</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">claude remote-control</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0c2833" stroke="#0891b2" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#67e8f9">QR 접속</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">URL·QR·세션 목록에서</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#12233a" stroke="#2563a8" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#93c5fd">조종·승인</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">모든 기기 실시간 동기화</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Claude Code 원격 시리즈 1편 — 세션 조종</text>
</svg>
