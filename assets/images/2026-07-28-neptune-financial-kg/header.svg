<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="S3 에 쌓인 금융 리포트를 파싱·추출·정규화해 Amazon Neptune 지식그래프에 시간축과 함께 적재하는 파이프라인 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="104" font-size="41" font-weight="800" fill="#f8fafc">S3 금융 리포트 → <tspan fill="#a78bfa">Neptune 지식그래프</tspan></text>
  <text class="ko" x="82" y="148" font-size="22" font-weight="500" fill="#94a3b8">테마 · 업종 · 컨센서스 · 뉴스 · 시계열을 시간축 위에 엮는 파이프라인</text>

  <g class="ko" text-anchor="middle">
    <rect x="70"  y="228" width="230" height="112" rx="16" fill="#10233a" stroke="#38bdf8" stroke-width="3"/>
    <text x="185" y="272" font-size="21" font-weight="800" fill="#7dd3fc">S3 (원본)</text>
    <text x="185" y="304" font-size="15" font-weight="500" fill="#cbd5e1">PDF · CSV · 뉴스</text>

    <rect x="355" y="228" width="230" height="112" rx="16" fill="#1b1a33" stroke="#818cf8" stroke-width="3"/>
    <text x="470" y="272" font-size="21" font-weight="800" fill="#a5b4fc">파싱 · 추출</text>
    <text x="470" y="304" font-size="15" font-weight="500" fill="#cbd5e1">엔티티 · 관계 · 근거</text>

    <rect x="640" y="228" width="230" height="112" rx="16" fill="#231a33" stroke="#a78bfa" stroke-width="3"/>
    <text x="755" y="272" font-size="21" font-weight="800" fill="#c4b5fd">정규화 · 해상도</text>
    <text x="755" y="304" font-size="15" font-weight="500" fill="#cbd5e1">안정 ID · 멱등키</text>

    <rect x="925" y="228" width="205" height="112" rx="16" fill="#12241c" stroke="#22c55e" stroke-width="3"/>
    <text x="1027" y="272" font-size="21" font-weight="800" fill="#86efac">Neptune</text>
    <text x="1027" y="304" font-size="15" font-weight="500" fill="#cbd5e1">as-of 질의</text>
  </g>

  <line x1="302" y1="284" x2="353" y2="284" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="587" y1="284" x2="638" y2="284" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="872" y1="284" x2="923" y2="284" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g class="ko">
    <text x="80" y="388" font-size="16" font-weight="600" fill="#64748b">유효시간 + 기록시간 · 출처와 근거 · 시간 감쇠 가중치 · 승격과 아카이브</text>
  </g>
</svg>
