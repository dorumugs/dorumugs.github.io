<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="여러 PR 충돌 자동 감지 정리 오케스트레이션 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="44" font-weight="800" fill="#f8fafc">여러 PR 충돌을 <tspan fill="#a78bfa">자동으로 정리</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">통합 담당 세션이 충돌을 감지하고 순서대로 풀어내기</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#1e1433" stroke="#6d28d9" stroke-width="3"/>
    <text x="215" y="284" font-size="23" font-weight="800" fill="#a78bfa">감지</text>
    <text x="215" y="316" font-size="16" font-weight="500" fill="#cbd5e1">mergeable 상태 조회</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1e1433" stroke="#6d28d9" stroke-width="3"/>
    <text x="600" y="284" font-size="23" font-weight="800" fill="#a78bfa">정리</text>
    <text x="600" y="316" font-size="16" font-weight="500" fill="#cbd5e1">rebase · 충돌 해결</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#1e1433" stroke="#6d28d9" stroke-width="3"/>
    <text x="985" y="284" font-size="23" font-weight="800" fill="#a78bfa">통합</text>
    <text x="985" y="316" font-size="16" font-weight="500" fill="#cbd5e1">순서대로 자동 머지</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 병렬 에이전트 작업 안전하게 합치기 (3)</text>
</svg>
