<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="MCP 서버를 원격 HTTP 와 인증으로 띄워 여러 사람이 같이 쓰는 방법 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="0.5" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">MCP 서버 원격 HTTP + 인증 <tspan fill="#5eead4">(2/2)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">Streamable HTTP 전환부터 Bearer·OAuth 2.1 인증, TLS 운영까지</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0b2822" stroke="#047857" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#6ee7b7">HTTP 전환</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">streamable-http 한 줄</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0c2926" stroke="#0d9488" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#5eead4">인증 필수</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">Bearer · OAuth 2.1</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0d2b2b" stroke="#14b8a6" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#99f6e4">운영 정석</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">TLS·Origin·프록시</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · MCP 서버 만들기 2편 — 원격 HTTP 인증</text>
</svg>
