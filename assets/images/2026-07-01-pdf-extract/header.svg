<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="PDF 에서 DB 로 데이터 추출 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1422"/>
      <stop offset="1" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="116" font-size="50" font-weight="800" fill="#f8fafc">PDF 에서 DB 로, 틀리지 않게</text>
  <text class="ko" x="82" y="160" font-size="24" font-weight="500" fill="#9aa6c0">구조체 파싱 vs OCR — 언제 무엇을 쓰나</text>

  <g class="ko" text-anchor="middle">
    <rect x="80" y="232" width="300" height="116" rx="18" fill="#2a1a0e" stroke="#f97316" stroke-width="3"/>
    <text x="230" y="278" font-size="22" font-weight="800" fill="#fbbf77">구조체 파싱</text>
    <text x="230" y="312" font-size="15" font-weight="500" fill="#cbd5e1">텍스트 레이어 · 문자 정확</text>

    <rect x="452" y="232" width="284" height="116" rx="18" fill="#0e2a2a" stroke="#22d3ee" stroke-width="3"/>
    <text x="594" y="278" font-size="22" font-weight="800" fill="#6fe3ef">OCR</text>
    <text x="594" y="312" font-size="15" font-weight="500" fill="#cbd5e1">스캔본 · confidence</text>

    <rect x="808" y="232" width="312" height="116" rx="18" fill="#0e2a1e" stroke="#34d399" stroke-width="3"/>
    <text x="964" y="278" font-size="22" font-weight="800" fill="#86efc3">검증 후 적재</text>
    <text x="964" y="312" font-size="15" font-weight="500" fill="#cbd5e1">타입·합계·사람 확인</text>
  </g>

  <g fill="#64748b" font-size="30" font-weight="800">
    <text x="404" y="298">›</text>
    <text x="760" y="298">›</text>
  </g>

  <text class="ko" x="80" y="392" font-size="18" fill="#6b7689">KayserDocs · 최대한 틀리지 않은 데이터만 DB 에 넣기</text>
</svg>
