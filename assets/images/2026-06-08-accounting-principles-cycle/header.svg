<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="회계 원리와 회계 순환 프로세스, 분개부터 재무제표까지 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">회계 원리와 순환 프로세스 <tspan fill="#5eead4">(1/4)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">복식부기와 회계등식부터 분개·전기·시산표·결산까지, (주)나래전자 첫 달로 따라가기</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2a28" stroke="#0d9488" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#5eead4">분개·전기</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">거래를 차변·대변으로</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#101d33" stroke="#2563eb" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#93c5fd">시산표·결산</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">차변 합 = 대변 합 검증</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#1c1533" stroke="#7c3aed" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#c4b5fd">재무제표</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">손익·재무상태표 작성</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 재무회계 시리즈 1편 — 숫자가 만들어지는 과정</text>
</svg>
