<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="LangChain 기본 사용법을 정리한 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">LangChain 기본기 <tspan fill="#93c5fd">(2/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">API 키 관리와 캐시부터 프롬프트 체인·Runnable 까지</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#122736" stroke="#0ea5e9" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#7dd3fc">.env·캐시</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">키 관리·비용 절감</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#14213d" stroke="#3b82f6" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#93c5fd">프롬프트 체인</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">PromptTemplate·LCEL</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#1a1f3d" stroke="#6366f1" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#a5b4fc">Runnable</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">스트림·배치·병렬</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · LangChain 입문 시리즈 2편</text>
</svg>
