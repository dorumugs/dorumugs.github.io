<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="MSSQL 마이그레이션 정합성 트러블슈팅 8가지 함정 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f1239"/>
      <stop offset="0.5" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="108" font-size="44" font-weight="800" fill="#f8fafc">정합성 <tspan fill="#fda4af">트러블슈팅</tspan></text>
  <text class="ko" x="82" y="152" font-size="22" font-weight="500" fill="#94a3b8">케이스별 8가지 함정 · 검출 → 보정 → 검증 (5/5)</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a0f1a" stroke="#e11d48" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fda4af">검출</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">중복키 · IDENTITY · FK</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a1c08" stroke="#f59e0b" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fbbf24">보정</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">DMS 옵션 · 시드</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#16a34a" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7dd3a8">검증</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">CHECKSUM_AGG · CHECKDB</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · MSSQL → AWS RDS 마이그레이션 시리즈</text>
</svg>
