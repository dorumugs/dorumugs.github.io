<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="코드 반출, 시크릿 유출, 에이전트 실행 권한, 프롬프트 인젝션, 토큰 비용으로 이어지는 AI 코딩 위험 지도 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#2a1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="98" font-size="41" font-weight="800" fill="#f8fafc">사고는 여기서 납니다 <tspan fill="#fda4af">— 위험 지도</tspan></text>
  <text class="ko" x="82" y="140" font-size="22" font-weight="500" fill="#94a3b8">속도가 아니라 반출 · 권한 · 청구서에서 터져요.</text>

  <g class="ko" text-anchor="middle">
    <rect x="70" y="196" width="196" height="106" rx="14" fill="#2c1420" stroke="#f43f5e" stroke-width="3"/>
    <text x="168" y="236" font-size="19" font-weight="800" fill="#fda4af">코드 반출</text>
    <text x="168" y="266" font-size="14" font-weight="500" fill="#cbd5e1">붙여넣기 · 인덱싱</text>
    <text x="168" y="288" font-size="13" font-weight="500" fill="#64748b">사내 규정 먼저</text>

    <rect x="296" y="196" width="196" height="106" rx="14" fill="#2a2010" stroke="#f59e0b" stroke-width="3"/>
    <text x="394" y="236" font-size="19" font-weight="800" fill="#fcd34d">시크릿</text>
    <text x="394" y="266" font-size="14" font-weight="500" fill="#cbd5e1">.env · 커밋 · 로그</text>
    <text x="394" y="288" font-size="13" font-weight="500" fill="#64748b">한 번 나가면 끝</text>

    <rect x="522" y="196" width="196" height="106" rx="14" fill="#2c1420" stroke="#fb7185" stroke-width="3"/>
    <text x="620" y="236" font-size="19" font-weight="800" fill="#fecdd3">실행 권한</text>
    <text x="620" y="266" font-size="14" font-weight="500" fill="#cbd5e1">자동 승인 범위</text>
    <text x="620" y="288" font-size="13" font-weight="500" fill="#64748b">삭제 · 배포 · DB</text>

    <rect x="748" y="196" width="196" height="106" rx="14" fill="#1e1a33" stroke="#a78bfa" stroke-width="3"/>
    <text x="846" y="236" font-size="19" font-weight="800" fill="#c4b5fd">인젝션</text>
    <text x="846" y="266" font-size="14" font-weight="500" fill="#cbd5e1">읽는 문서가 공격면</text>
    <text x="846" y="288" font-size="13" font-weight="500" fill="#64748b">이슈 · README</text>

    <rect x="974" y="196" width="156" height="106" rx="14" fill="#10233a" stroke="#38bdf8" stroke-width="3"/>
    <text x="1052" y="236" font-size="19" font-weight="800" fill="#7dd3fc">토큰 비용</text>
    <text x="1052" y="266" font-size="14" font-weight="500" fill="#cbd5e1">청구서 감각</text>
    <text x="1052" y="288" font-size="13" font-weight="500" fill="#64748b">캐시 · 라우팅</text>
  </g>

  <text class="ko" x="80" y="362" font-size="17" font-weight="600" fill="#fda4af">핵심 질문 — “어디까지 자동 승인해두고 쓰세요?”</text>
  <text class="ko" x="80" y="392" font-size="16" font-weight="500" fill="#475569">반출 경계 · 승인 범위 · 의존성 확인 · 월 사용액</text>
</svg>
