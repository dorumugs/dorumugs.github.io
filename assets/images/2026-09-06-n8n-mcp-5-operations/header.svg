<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="n8n MCP 서버 운영 리버스프록시 큐모드 보안 5편 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="0.5" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">운영 — <tspan fill="#bef264">끊기지 않게</tspan>, 새지 않게</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">리버스 프록시 · 큐 모드 · 실행 데이터 · 토큰과 권한 경계</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#166534" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#bef264">연결 유지</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">버퍼링 · 레플리카</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#b3b4e6">비용 관리</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">타임아웃 · 프루닝</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a1215" stroke="#dc2626" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fca5a5">권한 경계</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">토큰 · 스코프 · 감사</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · (5/5) 데모와 운영을 가르는 것들</text>
</svg>
