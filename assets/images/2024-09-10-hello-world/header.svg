<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Jekyll 기반 기술 블로그의 첫 인사글 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">개발 블로그의 시작, <tspan fill="#fbbf24">Hello World</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">Jekyll 로 기술 블로그를 열고 첫 글을 올렸어요</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a2010" stroke="#f59e0b" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fbbf24">Hello World</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">첫 코드 한 줄</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0c2434" stroke="#0ea5e9" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#7dd3fc">LaTeX 수식</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">수식 렌더링 지원</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#201a33" stroke="#8b5cf6" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#c4b5fd">블로그 로고</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">직접 만든 로고 공개</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 블로그 첫 인사글</text>
</svg>
