<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="브라우저에서 S3 로 직접 저장하는 공유 편집에 rev 버전 가드로 덮어쓰기 유실을 막는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#241a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="43" font-weight="800" fill="#f8fafc">덮어쓰기 유실을 막는 <tspan fill="#c084fc">rev 버전 가드</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">브라우저 → S3 직접 저장, 저장 직전 read-before-write 로 충돌 차단</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="260" height="118" rx="16" fill="#1e1830" stroke="#7c3aed" stroke-width="3"/>
    <text x="220" y="280" font-size="21" font-weight="800" fill="#c084fc">rev 기준선</text>
    <text x="220" y="312" font-size="16" font-weight="500" fill="#cbd5e1">로드 때 LOADED_REV 캡처</text>
    <rect x="470" y="236" width="260" height="118" rx="16" fill="#1e1830" stroke="#7c3aed" stroke-width="3"/>
    <text x="600" y="280" font-size="21" font-weight="800" fill="#c084fc">저장 직전 재조회</text>
    <text x="600" y="312" font-size="16" font-weight="500" fill="#cbd5e1">서버 rev 와 비교</text>
    <rect x="850" y="236" width="260" height="118" rx="16" fill="#132218" stroke="#0d9488" stroke-width="3"/>
    <text x="980" y="280" font-size="21" font-weight="800" fill="#5eead4">일치 → PUT</text>
    <text x="980" y="312" font-size="16" font-weight="500" fill="#cbd5e1">불일치 → 저장 차단</text>
  </g>

  <line x1="355" y1="295" x2="463" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="735" y1="295" x2="843" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 백엔드 없이 동시 편집 지키기</text>
</svg>
