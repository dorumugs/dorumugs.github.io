<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="9~12억 수도권 핵심·서울 외곽으로 갈아타는 두 갈래 전략 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">9~12억, 수도권 핵심 <tspan fill="#7dd3fc">(2/5)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">광명·수원·동탄 대장 신축과 서울 외곽 가성비 — 전세 레버리지로 점프</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0c2334" stroke="#0284c7" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#7dd3fc">수도권 대장 신축</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">광명·수원·동탄</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0d2740" stroke="#0ea5e9" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#93dcfd">서울 외곽 진입</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">동대문·은평 구축</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0e2b46" stroke="#38bdf8" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#bae6fd">전세 레버리지</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">갭만 더해 상급지 점프</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 입지 갈아타기 로드맵 2/5</text>
</svg>
