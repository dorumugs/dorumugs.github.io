<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="검토 로그를 되먹여 양식별 파서 붙이기 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1422"/>
      <stop offset="1" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="116" font-size="48" font-weight="800" fill="#f8fafc">검토 로그를 되먹여, 양식별 파서로</text>
  <text class="ko" x="82" y="160" font-size="24" font-weight="500" fill="#9aa6c0">검토 로그 → 양식 클러스터 → 전용 파서 → 파이프라인</text>

  <g class="ko" text-anchor="middle">
    <rect x="72" y="238" width="216" height="104" rx="16" fill="#2a1a0e" stroke="#f59e0b" stroke-width="3"/>
    <text x="180" y="284" font-size="20" font-weight="800" fill="#fbbf77">검토 로그</text>
    <text x="180" y="314" font-size="14" font-weight="500" fill="#cbd5e1">교정값 = 라벨</text>

    <rect x="344" y="238" width="216" height="104" rx="16" fill="#2a0e22" stroke="#f472b6" stroke-width="3"/>
    <text x="452" y="284" font-size="20" font-weight="800" fill="#f9a8d4">양식 클러스터</text>
    <text x="452" y="314" font-size="14" font-weight="500" fill="#cbd5e1">거절 몰린 양식</text>

    <rect x="616" y="238" width="216" height="104" rx="16" fill="#1c1830" stroke="#a78bfa" stroke-width="3"/>
    <text x="724" y="284" font-size="20" font-weight="800" fill="#c4b1fb">전용 파서</text>
    <text x="724" y="314" font-size="14" font-weight="500" fill="#cbd5e1">앵커 추출</text>

    <rect x="888" y="238" width="236" height="104" rx="16" fill="#0e2a1e" stroke="#34d399" stroke-width="3"/>
    <text x="1006" y="284" font-size="20" font-weight="800" fill="#86efc3">회귀 테스트</text>
    <text x="1006" y="314" font-size="14" font-weight="500" fill="#cbd5e1">골든셋 · 드리프트</text>
  </g>

  <g fill="#64748b" font-size="28" font-weight="800">
    <text x="304" y="298">›</text>
    <text x="576" y="298">›</text>
    <text x="848" y="298">›</text>
  </g>

  <text class="ko" x="80" y="392" font-size="18" fill="#6b7689">KayserDocs · 사람이 고친 값을 버리지 말고, 다음 문서의 정확도로 바꾸기</text>
</svg>
