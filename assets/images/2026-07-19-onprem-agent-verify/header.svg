<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="라우터가 대부분 요청은 로컬 vLLM 으로, 최상단 일부만 클라우드로 보내는 로컬 기본 클라우드 폴백 하이브리드 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1a1608"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="108" font-size="43" font-weight="800" fill="#f8fafc">"완벽히 동일"의 조건 — <tspan fill="#fbbf24">하이브리드</tspan></text>
  <text class="ko" x="82" y="152" font-size="23" font-weight="500" fill="#b3a888">골든셋으로 검증하고, 로컬 기본 · 클라우드 폴백으로 갭 메우기</text>

  <g class="ko" text-anchor="middle">
    <rect x="110" y="238" width="230" height="112" rx="16" fill="#151a24" stroke="#94a3b8" stroke-width="3"/>
    <text x="225" y="284" font-size="22" font-weight="800" fill="#e2e8f0">라우터</text>
    <text x="225" y="316" font-size="16" font-weight="500" fill="#cbd5e1">난이도 · 민감도로 분배</text>

    <rect x="470" y="182" width="290" height="98" rx="16" fill="#12241c" stroke="#22c55e" stroke-width="3"/>
    <text x="615" y="222" font-size="21" font-weight="800" fill="#86efac">로컬 vLLM (기본)</text>
    <text x="615" y="252" font-size="16" font-weight="500" fill="#cbd5e1">일상 · 민감 코드 · 비용 0</text>

    <rect x="470" y="306" width="290" height="90" rx="16" fill="#0f2137" stroke="#38bdf8" stroke-width="3"/>
    <text x="615" y="344" font-size="21" font-weight="800" fill="#7dd3fc">클라우드 (폴백)</text>
    <text x="615" y="372" font-size="16" font-weight="500" fill="#cbd5e1">최고난도 · 초장문만</text>
  </g>

  <line x1="342" y1="278" x2="466" y2="232" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="342" y1="300" x2="466" y2="346" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <g class="ko">
    <text x="820" y="228" font-size="17" font-weight="700" fill="#cbd5e1">✓ 골든셋 성공률</text>
    <text x="820" y="262" font-size="17" font-weight="700" fill="#cbd5e1">✓ 툴 콜 실패율</text>
    <text x="820" y="296" font-size="17" font-weight="700" fill="#cbd5e1">✓ 부하 시 지연</text>
    <text x="820" y="330" font-size="17" font-weight="700" fill="#cbd5e1">✓ 민감 코드 로컬 고정</text>
  </g>

  <text class="ko" x="80" y="404" font-size="17" fill="#7a7358">KayserDocs · 80~95% 를 로컬로, 남는 최상단만 하이브리드</text>
</svg>
