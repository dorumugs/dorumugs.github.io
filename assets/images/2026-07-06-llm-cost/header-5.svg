<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="LLM API 비용 추적 5편 — Grafana 대시보드로 비용 한눈에 보기 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">LLM API 비용 추적 <tspan fill="#6ee7b7">(5/5)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">Grafana 대시보드 — 숫자는 답하고, 추세는 그림이어야 보인다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#5ec6d6">SQLite 적재</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">2편 트래커 그대로</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0f2a20" stroke="#059669" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#6ee7b7">Grafana 패널</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">일별 · 모델 · 팀 · 캐시</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0f2a20" stroke="#059669" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#6ee7b7">임계 알림</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">넘는 순간 Slack</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 비용의 추세가 보이는 팀 만들기</text>
</svg>
