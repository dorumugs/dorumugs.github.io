<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="LLM API 비용 추적 2편 — 파이썬 통합 비용 트래커 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">LLM API 비용 추적 <tspan fill="#fbbf24">(2/5)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">파이썬으로 4사 통합 비용 트래커 만들기 — usage 정규화부터 일별 리포트까지</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2b2010" stroke="#d97706" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fbbf24">usage 정규화</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">4사 응답 → 공통 스키마</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#b3b4e6">SQLite 로깅</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">호출마다 비용 기록</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2b2010" stroke="#d97706" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fbbf24">일별 리포트</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">모델별 지출 집계</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 호출 한 번마다 얼마 썼는지 바로 보이게</text>
</svg>
