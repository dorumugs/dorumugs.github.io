<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1a1330"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- title block -->
  <text x="70" y="80" fill="#e2e8f0" font-size="43" font-weight="700">배당락 차익, 세후로 끝까지</text>
  <text x="72" y="112" fill="#f0abfc" font-size="19" font-weight="500">받은 배당에서 세금 · 배당락 · 비용을 빼면 — 거의 항상 마이너스</text>

  <!-- waterfall chart : zero line y=240, scale 0.00004 px/원 -->
  <line x1="100" y1="240" x2="700" y2="240" stroke="#475569" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="690" y="234" fill="#64748b" font-size="13" text-anchor="end">0원</text>

  <!-- connectors -->
  <g stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="206" y1="140"   x2="232" y2="140"/>
    <line x1="318" y1="155.4" x2="344" y2="155.4"/>
    <line x1="430" y1="255.4" x2="456" y2="255.4"/>
    <line x1="542" y1="258.8" x2="600" y2="258.8"/>
  </g>

  <!-- b1 배당 +250만 -->
  <rect x="120" y="140" width="86" height="100" rx="3" fill="#34d399"/>
  <text x="163" y="132" fill="#6ee7b7" font-size="16" font-weight="600" text-anchor="middle">+250만</text>

  <!-- b2 배당세 −38.5만 -->
  <rect x="232" y="140" width="86" height="15.4" rx="2" fill="#f87171"/>
  <text x="275" y="132" fill="#fca5a5" font-size="16" font-weight="600" text-anchor="middle">−38.5만</text>

  <!-- b3 배당락 −250만 -->
  <rect x="344" y="155.4" width="86" height="100" rx="3" fill="#ef4444"/>
  <text x="387" y="212" fill="#fee2e2" font-size="16" font-weight="700" text-anchor="middle">−250만</text>

  <!-- b4 거래비용 −8.6만 -->
  <rect x="456" y="255.4" width="86" height="9" rx="2" fill="#f87171"/>
  <text x="499" y="250" fill="#fca5a5" font-size="16" font-weight="600" text-anchor="middle">−8.6만</text>

  <!-- b5 순손익 −47만 -->
  <rect x="600" y="240" width="86" height="18.84" rx="2" fill="#b91c1c" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="643" y="282" fill="#fecaca" font-size="17" font-weight="700" text-anchor="middle">−47만</text>

  <!-- category row -->
  <g fill="#94a3b8" font-size="15" text-anchor="middle">
    <text x="163" y="305">배당</text>
    <text x="275" y="305">배당세</text>
    <text x="387" y="305">배당락</text>
    <text x="499" y="305">거래비용</text>
    <text x="643" y="305" fill="#fda4af" font-weight="600">순손익</text>
  </g>

  <!-- takeaway panel -->
  <g transform="translate(770,128)">
    <rect x="0" y="0" width="372" height="186" rx="14" fill="#0b1220" stroke="#3b2150" stroke-width="1.5"/>
    <text x="26" y="44" fill="#e2e8f0" font-size="19" font-weight="700">핵심 한 줄</text>
    <text x="26" y="82" fill="#cbd5e1" font-size="16">세전 손익 = 배당 − 배당락 ≈ 0</text>
    <text x="26" y="114" fill="#fca5a5" font-size="16" font-weight="600">세후 손익 = −(배당세 + 거래비용)</text>
    <text x="26" y="150" fill="#94a3b8" font-size="14">배당은 과세, 배당락(손실)은 소액주주에게</text>
    <text x="26" y="170" fill="#94a3b8" font-size="14">비과세 → 손실의 절세 효과가 0이라 그렇습니다</text>
  </g>
  <text x="772" y="352" fill="#64748b" font-size="13">KayserDocs · 2026 · 5천만원 · 고배당 5% 가정</text>
</svg>
