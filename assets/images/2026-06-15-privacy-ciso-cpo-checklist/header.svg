<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="CISO 와 CPO 의 개인정보보호 점검 관점과 실무자 체크리스트 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a90d9"/>
      <stop offset="0.5" stop-color="#c25460"/>
      <stop offset="1" stop-color="#217346"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">CISO·CPO 가 보는 <tspan fill="#7db8ec">개인정보보호</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">두 책임자의 점검 렌즈, 그리고 실무자가 준비할 증적과 절차</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#10233a" stroke="#4a90d9" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#7db8ec">CPO 관점</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">적법성 · 정보주체 권리</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a151a" stroke="#c25460" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#e08a95">CISO 관점</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">암호화 · 접근통제 · 로그</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7dd3a8">실무 체크</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">라이프사이클 · 유출대응</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 개인정보보호 실무 체크리스트</text>
</svg>
