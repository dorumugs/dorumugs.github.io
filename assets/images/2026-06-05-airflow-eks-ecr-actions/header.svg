<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Airflow on EKS — GitHub Actions 로 ECR 이미지 자동화 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="0.5" stop-color="#217346"/>
      <stop offset="1" stop-color="#7dd3a8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">Airflow on EKS <tspan fill="#7dd3a8">(5/5)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">GitHub Actions 가 ECR 로 굽고, EKS 워커가 받아 쓴다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#7dd3a8">GitHub Actions</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">OIDC 로 빌드·푸시</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0f2b1a" stroke="#16a34a" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#86efac">ECR</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">커밋 SHA = 태그</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0e2718" stroke="#15803d" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7dd3a8">EKS</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">워커 Pod 가 이미지 풀</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Airflow on K8s 5부작 — 5편 AWS 응용</text>
</svg>
