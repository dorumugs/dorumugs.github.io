<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="전용 84제곱미터 중위가를 단지 세대수로 걸러 다시 뽑은 서울·경기 보정판 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.5" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">전용 84㎡ 중위가, <tspan fill="#a5b4fc">세대수 보정판</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">서울 200·경기 300세대 이상 단지만 남겼더니, 서초가 강남을 제치고 순위가 바뀌었다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#171a33" stroke="#4f46e5" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#a5b4fc">세대수 매칭</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">23,845건 98.6% 매칭</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0c2733" stroke="#0891b2" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#67e8f9">필터 적용</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">서울 200 · 경기 300세대+</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0d2a1f" stroke="#059669" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#6ee7b7">순위 변동</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">서초 1위·마포·양천 점프</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 실거래 × 단지 세대수 데이터 보정 분석</text>
</svg>
