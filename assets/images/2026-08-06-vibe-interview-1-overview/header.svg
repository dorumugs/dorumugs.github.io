<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="바이브 코딩 면접에서 후보자를 네 갈래로 가르는 지도 — 증폭형, 확장형, 위임형, 수집형 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1c1430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.34" stop-color="#38bdf8"/>
      <stop offset="0.67" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="104" font-size="41" font-weight="800" fill="#f8fafc">바이브 코딩 면접 <tspan fill="#a78bfa">면접관의 지도</tspan></text>
  <text class="ko" x="82" y="148" font-size="22" font-weight="500" fill="#94a3b8">AI 를 썼는지 묻지 마세요. 어떻게 썼는지를 물어야 갈립니다.</text>

  <g class="ko" text-anchor="middle">
    <rect x="70"  y="222" width="248" height="124" rx="16" fill="#0f2a1c" stroke="#22c55e" stroke-width="3"/>
    <text x="194" y="264" font-size="20" font-weight="800" fill="#86efac">증폭형</text>
    <text x="194" y="296" font-size="15" font-weight="500" fill="#cbd5e1">원래 되던 사람이 빨라짐</text>
    <text x="194" y="322" font-size="14" font-weight="500" fill="#64748b">설계 · 디버깅이 살아있음</text>

    <rect x="348" y="222" width="248" height="124" rx="16" fill="#10233a" stroke="#38bdf8" stroke-width="3"/>
    <text x="472" y="264" font-size="20" font-weight="800" fill="#7dd3fc">확장형</text>
    <text x="472" y="296" font-size="15" font-weight="500" fill="#cbd5e1">다룬 범위가 넓어짐</text>
    <text x="472" y="322" font-size="14" font-weight="500" fill="#64748b">넓지만 얕을 수 있음</text>

    <rect x="626" y="222" width="248" height="124" rx="16" fill="#2c1420" stroke="#f43f5e" stroke-width="3"/>
    <text x="750" y="264" font-size="20" font-weight="800" fill="#fda4af">위임형</text>
    <text x="750" y="296" font-size="15" font-weight="500" fill="#cbd5e1">읽지 않고 넘김</text>
    <text x="750" y="322" font-size="14" font-weight="500" fill="#64748b">산출물은 멀쩡해 보임</text>

    <rect x="904" y="222" width="226" height="124" rx="16" fill="#2a2010" stroke="#f59e0b" stroke-width="3"/>
    <text x="1017" y="264" font-size="20" font-weight="800" fill="#fcd34d">수집형</text>
    <text x="1017" y="296" font-size="15" font-weight="500" fill="#cbd5e1">도구 얘기만 술술</text>
    <text x="1017" y="322" font-size="14" font-weight="500" fill="#64748b">유지보수 이력 없음</text>
  </g>

  <text class="ko" x="80" y="196" font-size="17" font-weight="600" fill="#c4b5fd">채점 3축 — 설명 가능성 · 검증 습관 · 사고 책임</text>
</svg>
