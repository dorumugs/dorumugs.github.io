<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="맥에서 LangChain 개발 환경을 준비하는 과정 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">LLM 개발 환경 셋업 <tspan fill="#5eead4">(1/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">OpenAI API 키 발급부터 Homebrew·pyenv·Poetry 까지</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2a28" stroke="#14b8a6" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#5eead4">API Key</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">OpenAI 결제·발급</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0891b2" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#67e8f9">pyenv</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">파이썬 버전 관리</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#122736" stroke="#0284c7" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7dd3fc">Poetry</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">패키지·가상환경</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · LangChain 입문 시리즈 1편</text>
</svg>
