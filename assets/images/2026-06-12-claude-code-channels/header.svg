<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="텔레그램과 CI 이벤트를 돌고 있는 세션에 흘려보내는 Claude Code Channels 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">Claude Code Channels <tspan fill="#c4b5fd">(3/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">텔레그램·디스코드·CI 웹훅 이벤트를 돌고 있는 세션에 실시간으로 밀어 넣기</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#1e1533" stroke="#6d28d9" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#c4b5fd">외부 이벤트</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">텔레그램·CI·웹훅</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#201639" stroke="#7c3aed" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#d8b4fe">채널 서버</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">로컬 MCP 가 전달</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#23173d" stroke="#9333ea" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#e9d5ff">세션 반응</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">하던 맥락 그대로 응답</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Claude Code 원격 시리즈 3편 — 이벤트 연결</text>
</svg>
