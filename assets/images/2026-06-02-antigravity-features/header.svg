<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Google Antigravity 현업 활용 기능 정리 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">Antigravity 실무 기능 정리 <tspan fill="#fdba74">(1/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">Mission Control · Artifacts · 브라우저 자동화 — 현업에서 쓸 것만</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a170d" stroke="#c2410c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fdba74">Mission Control</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">멀티 에이전트 관제</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#271d0b" stroke="#a16207" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fbbf24">Artifacts</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">스크린샷 · 녹화 증거</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a170d" stroke="#c2410c" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fdba74">Knowledge Items</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">컨텍스트 재사용</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · AI IDE 현업 활용 시리즈</text>
</svg>
