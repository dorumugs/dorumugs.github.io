<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Copilot Studio 자율 에이전트 핸즈온 배너 — 트리거로 스스로 도는 메일 분류봇">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#6264a7"/>
      <stop offset="1" stop-color="#c2710c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">사람이 안 불러도 도는 <tspan fill="#b794f6">자율 에이전트</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">트리거로 스스로 깨어나는 받은 편지함 분류봇</text>

  <!-- pipeline: 이벤트 트리거 → 자율 판단 → 라우팅/에스컬레이션 -->
  <g class="ko" text-anchor="middle">
    <!-- 트리거 -->
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#231a3a" stroke="#7c3aed" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#b794f6">이벤트 트리거</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">메일 도착 → 스스로 깨어남</text>

    <!-- 판단 -->
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#b3b4e6">자율 판단</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">분류 · 규정 답변 · 요약</text>

    <!-- 라우팅 -->
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a1d0c" stroke="#c2710c" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#f0b15c">라우팅</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">담당 배정 · 에스컬레이션</text>
  </g>

  <!-- arrows -->
  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 무인으로 돌수록 가드레일을 더 촘촘히</text>
</svg>
