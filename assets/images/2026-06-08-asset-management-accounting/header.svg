<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="자산운용 관점에서 재무·회계 활용, 이익의 질과 의사결정 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">자산운용에서 재무·회계 활용 <tspan fill="#fbbf24">(4/4)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">이익의 질과 발생액, 분식 신호 거르기, 그리고 투자 의사결정 체크리스트까지</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a1e0e" stroke="#d97706" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fbbf24">이익의 질</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">발생액·일회성 항목</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1c1533" stroke="#7c3aed" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#c4b5fd">회계의 함정</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">분식 신호 걸러내기</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#101d33" stroke="#2563eb" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#93c5fd">투자 의사결정</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">운용 체크리스트</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 재무회계 시리즈 4편 — 운용 의사결정에 쓰는 법</text>
</svg>
