<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="16~25억 서울 준상급 84㎡ 대장과 한강 라인·준강남 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">16~25억, 준상급·한강 <tspan fill="#a5b4fc">(4/5)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">마포·고덕·옥수·목동 84㎡ 대장과 흑석 한강, 과천·분당·판교</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#191d3d" stroke="#4f46e5" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#a5b4fc">84㎡ 대장</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">마포·고덕·옥수·목동</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1b1f4a" stroke="#6366f1" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#b4bcfd">한강 라인</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">흑석 한강 조망</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#1d2250" stroke="#818cf8" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#c7d2fe">준강남</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">과천·분당·판교</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 입지 갈아타기 로드맵 4/5</text>
</svg>
