<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="애플리케이션 계층 L7 공격 — 정상 요청처럼 굴며 서버를 태우는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">애플리케이션 계층 <tspan fill="#c4b5fd">L7 공격</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">정상 요청처럼 보이지만 서버의 CPU와 커넥션을 태운다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#211a3a" stroke="#7c3aed" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#c4b5fd">봇넷</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">진짜 HTTP처럼</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#211a3a" stroke="#a78bfa" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#ddd6fe">무거운 요청</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">flood · slow · reset</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#211a3a" stroke="#c4b5fd" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#ede9fe">웹 서버</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">CPU · 워커 소진</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 적은 대역폭으로 통하는, 가장 까다로운 공격</text>
</svg>
