<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="내 사이트 DDoS 내성 테스트 — 합법적으로 방어를 검증하는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">내 사이트 <tspan fill="#22d3ee">DDoS 내성 테스트</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">세운 방어가 진짜 버티는지, 합법적으로 두들겨 검증한다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0c2733" stroke="#0891b2" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#67e8f9">승인 · 격리</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">스테이징 · 폐쇄 랩</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0c2733" stroke="#06b6d4" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#67e8f9">부하 생성</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">k6 · 정식 도구</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0c2733" stroke="#22d3ee" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#a5f3fc">관측 · 튜닝</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">방어 발동 → 되먹임</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 부터·봇넷 금지 · 승인된 자산만 · 인터넷 미노출</text>
</svg>
