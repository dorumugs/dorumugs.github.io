<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="프로토콜 상태 고갈 공격 — 연결 테이블을 채워버리는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">프로토콜 <tspan fill="#fbbf24">상태 고갈</tspan> 공격</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">SYN 반쪽 연결로 서버의 연결 테이블을 가득 채워버린다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a2008" stroke="#b45309" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fcd34d">SYN 폭주</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">마지막 ACK 안 보냄</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a2008" stroke="#f59e0b" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fcd34d">backlog 큐</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">SYN_RECV 로 가득</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a2008" stroke="#fbbf24" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fcd34d">연결 거부</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">정상 요청 차단</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · SYN · ACK · 조각화 · 상태 테이블 고갈</text>
</svg>
