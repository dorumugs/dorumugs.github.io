<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="볼류메트릭 반사증폭 공격 — 작은 질의로 거대한 응답을 만드는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">볼류메트릭 <tspan fill="#f87171">반사증폭</tspan> 공격</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">작은 질의 하나로 거대한 응답을 유발해 대역폭을 말려버린다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a1414" stroke="#b91c1c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fca5a5">공격자</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">출발지 IP 위조</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a1414" stroke="#ef4444" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fca5a5">반사서버</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">DNS · NTP · memcached</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a1414" stroke="#f87171" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fca5a5">피해 서버</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">대역폭 포화</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 증폭 계수 수십 ~ 5만 배</text>
</svg>
