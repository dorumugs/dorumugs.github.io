<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="탐지한 개인정보를 마스킹하고 격리 저장하는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1422"/>
      <stop offset="1" stop-color="#0d1a17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="116" font-size="50" font-weight="800" fill="#f8fafc">잡은 다음이 진짜 문제다</text>
  <text class="ko" x="82" y="160" font-size="24" font-weight="500" fill="#9aa6c0">마스킹(값을 죽인다) · 토큰화(값을 잠근다) · 격리(문서를 잠근다)</text>

  <g class="ko" text-anchor="middle">
    <rect x="72" y="238" width="212" height="104" rx="16" fill="#2a1a0e" stroke="#f59e0b" stroke-width="3"/>
    <text x="178" y="284" font-size="20" font-weight="800" fill="#fbbf77">마스킹</text>
    <text x="178" y="314" font-size="14" font-weight="500" fill="#cbd5e1">비가역 · 900101-1******</text>

    <rect x="340" y="238" width="212" height="104" rx="16" fill="#0e2a1e" stroke="#34d399" stroke-width="3"/>
    <text x="446" y="284" font-size="20" font-weight="800" fill="#86efc3">토큰화</text>
    <text x="446" y="314" font-size="14" font-weight="500" fill="#cbd5e1">가역 · 볼트에 원본</text>

    <rect x="608" y="238" width="212" height="104" rx="16" fill="#0e2233" stroke="#38bdf8" stroke-width="3"/>
    <text x="714" y="284" font-size="20" font-weight="800" fill="#7fc9f5">격리</text>
    <text x="714" y="314" font-size="14" font-weight="500" fill="#cbd5e1">암호화 · 최소권한</text>

    <rect x="876" y="238" width="248" height="104" rx="16" fill="#2a0e1a" stroke="#f472b6" stroke-width="3"/>
    <text x="1000" y="284" font-size="20" font-weight="800" fill="#f9a8d4">파기</text>
    <text x="1000" y="314" font-size="14" font-weight="500" fill="#cbd5e1">TTL · 키 파기로 소각</text>
  </g>

  <g fill="#64748b" font-size="28" font-weight="800">
    <text x="300" y="298">›</text>
    <text x="568" y="298">›</text>
    <text x="836" y="298">›</text>
  </g>

  <text class="ko" x="80" y="392" font-size="18" fill="#6b7689">KayserDocs · 개인정보는 오래 들고 있는 것 자체가 리스크다</text>
</svg>
