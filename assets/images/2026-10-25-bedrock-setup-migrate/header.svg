<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="기존 OpenAI·Anthropic API 코드를 Bedrock 으로 옮기기 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.5" stop-color="#ca8a04"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="104" font-size="40" font-weight="800" fill="#f8fafc">기존 코드 옮기기 <tspan fill="#fcd34d">단계 전환까지</tspan></text>
  <text class="ko" x="82" y="148" font-size="22" font-weight="500" fill="#94a3b8">호출 지점 목록부터 만들고, 롤백 스위치를 남긴 채 옮겨요.</text>

  <g class="ko" text-anchor="middle">
    <rect x="90" y="226" width="250" height="138" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="215" y="276" font-size="23" font-weight="800" fill="#5ec6d6">① 목록</text>
    <text x="215" y="310" font-size="16" font-weight="500" fill="#cbd5e1">호출 지점·기능</text>
    <text x="215" y="338" font-size="14" font-weight="500" fill="#64748b">코드·설정·n8n·CI</text>
    <rect x="475" y="226" width="250" height="138" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="276" font-size="23" font-weight="800" fill="#b3b4e6">② 비교 평가</text>
    <text x="600" y="310" font-size="16" font-weight="500" fill="#cbd5e1">같은 입력, 두 경로</text>
    <text x="600" y="338" font-size="14" font-weight="500" fill="#64748b">품질·지연·비용</text>
    <rect x="860" y="226" width="250" height="138" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="985" y="276" font-size="23" font-weight="800" fill="#7dd3a8">③ 단계 전환</text>
    <text x="985" y="310" font-size="16" font-weight="500" fill="#cbd5e1">일부 → 전체</text>
    <text x="985" y="338" font-size="14" font-weight="500" fill="#64748b">롤백 후 키 회수</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · AWS Bedrock 으로 OpenAI GPT·Claude 첫 세팅 (5/5)</text>
</svg>
