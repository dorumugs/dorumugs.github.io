<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="에이전트 루프에서 모델이 툴 콜을 뱉고 하네스가 도구를 실행해 결과를 다시 모델에 먹이는 하네스 연결 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08160e" />
      <stop offset="1" stop-color="#0e2418"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="108" font-size="43" font-weight="800" fill="#f8fafc">로컬 모델을 <tspan fill="#34d399">에이전트 CLI</tspan> 에 물리기</text>
  <text class="ko" x="82" y="152" font-size="23" font-weight="500" fill="#8fb8a0">base_url 하나로 툴 콜·MCP 를 그대로 살리는 에이전트 루프</text>

  <g class="ko" text-anchor="middle">
    <rect x="100" y="238" width="250" height="112" rx="16" fill="#0e2a1c" stroke="#34d399" stroke-width="3"/>
    <text x="225" y="284" font-size="22" font-weight="800" fill="#6ee7b7">로컬 모델</text>
    <text x="225" y="316" font-size="16" font-weight="500" fill="#cbd5e1">"이 도구를 이 인자로"</text>

    <rect x="475" y="238" width="250" height="112" rx="16" fill="#0f2137" stroke="#38bdf8" stroke-width="3"/>
    <text x="600" y="284" font-size="22" font-weight="800" fill="#7dd3fc">하네스</text>
    <text x="600" y="316" font-size="16" font-weight="500" fill="#cbd5e1">도구 실행 · 편집 · bash</text>

    <rect x="850" y="238" width="250" height="112" rx="16" fill="#241a2e" stroke="#a855f7" stroke-width="3"/>
    <text x="975" y="284" font-size="22" font-weight="800" fill="#d8b4fe">코드베이스</text>
    <text x="975" y="316" font-size="16" font-weight="500" fill="#cbd5e1">파일 · 테스트 · MCP</text>
  </g>

  <line x1="352" y1="278" x2="472" y2="278" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="727" y1="278" x2="847" y2="278" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M850 328 Q600 392 350 328" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text class="ko" x="600" y="384" font-size="15" fill="#64748b" text-anchor="middle">실행 결과를 다시 모델에 먹임</text>

  <text class="ko" x="80" y="404" font-size="17" fill="#5b7565">KayserDocs · 두뇌만 로컬로, 도구 생태계는 그대로</text>
</svg>
