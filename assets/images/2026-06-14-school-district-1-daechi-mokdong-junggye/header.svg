<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="서울 전통 3대 학군 대치·목동·중계, 대장 단지와 학원가 단지 비교 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">서울 3대 학군 <tspan fill="#fbbf24">(1/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">대치·목동·중계 — 대장 단지와 학원가 단지는 따로 논다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a1d0a" stroke="#b45309" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fbbf24">대치동</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">은마·미도 학원가</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2e2008" stroke="#d97706" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fcd34d">목동</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">신시가지 재건축</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#33230a" stroke="#f59e0b" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fde68a">중계동</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">은행사거리 도보권</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 학군지 시리즈 1/3</text>
</svg>
