<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2c4a"/>
      <stop offset="1" stop-color="#16456f"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5c86"/>
      <stop offset="1" stop-color="#123a5c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- 제목 -->
  <text x="70" y="86" fill="#eaf3fb" font-size="42" font-weight="800">서울·경기 국제중·사립중 지도</text>
  <text x="70" y="130" fill="#9fc4e2" font-size="22" font-weight="500">위치 · 특징 · 장점 · 단점 — 세 갈래를 실제 학교로 내려보기</text>

  <!-- 스타일화된 지도 영역 -->
  <g transform="translate(690,150)">
    <path d="M40,30 Q120,-10 220,20 Q320,45 380,120 Q400,190 320,220 Q200,255 110,220 Q20,185 20,110 Q22,60 40,30 Z"
          fill="url(#land)" stroke="#3d7cab" stroke-width="2" opacity="0.9"/>
    <text x="60" y="60" fill="#7fb0d6" font-size="15" opacity="0.8">경기</text>
    <text x="200" y="150" fill="#7fb0d6" font-size="15" opacity="0.8">서울</text>

    <!-- 청심(가평, 북동) -->
    <circle cx="300" cy="55" r="9" fill="#ffd166" filter="url(#soft)"/>
    <text x="300" y="42" fill="#ffe6a3" font-size="15" font-weight="700" text-anchor="middle">청심</text>
    <!-- 영훈(강북) -->
    <circle cx="185" cy="120" r="9" fill="#06d6a0" filter="url(#soft)"/>
    <text x="185" y="108" fill="#a9f0da" font-size="15" font-weight="700" text-anchor="middle">영훈</text>
    <!-- 대원(광진) -->
    <circle cx="235" cy="160" r="9" fill="#ef476f" filter="url(#soft)"/>
    <text x="255" y="182" fill="#f7b6c7" font-size="15" font-weight="700">대원</text>
  </g>

  <!-- 하단 요약 칩 -->
  <g font-size="18" font-weight="700">
    <rect x="70" y="300" rx="10" width="248" height="64" fill="#12395b" stroke="#3d7cab" stroke-width="1.5"/>
    <text x="90" y="330" fill="#ffd166" font-size="15">국제중 3곳</text>
    <text x="90" y="354" fill="#eaf3fb">대원·영훈·청심</text>

    <rect x="336" y="300" rx="10" width="270" height="64" fill="#12395b" stroke="#3d7cab" stroke-width="1.5"/>
    <text x="356" y="330" fill="#06d6a0" font-size="15">사립중</text>
    <text x="356" y="354" fill="#eaf3fb">강남권·목동·경기</text>
  </g>

  <text x="70" y="404" fill="#6f97b8" font-size="14">선발·학비·존치는 연도·교육청마다 바뀝니다 — 그해 모집요강을 직접 확인하세요.</text>
</svg>
