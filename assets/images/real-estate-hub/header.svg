<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="부동산 도구 모음 배너 — 실거래·학군·입지">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="0.5" stop-color="#1baf7a"/>
      <stop offset="1" stop-color="#eda100"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">부동산 <tspan fill="#86b6ef">도구 모음</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">수도권 집을 고를 때 실제로 보게 되는 것들을 하나씩 도구로 만듭니다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2233" stroke="#2a78d6" stroke-width="3"/>
    <text x="215" y="284" font-size="24" font-weight="800" fill="#86b6ef">실거래</text>
    <text x="215" y="316" font-size="16" font-weight="500" fill="#cbd5e1">얼마에 팔렸나</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0f2620" stroke="#1baf7a" stroke-width="3"/>
    <text x="600" y="284" font-size="24" font-weight="800" fill="#7dd3a8">학군</text>
    <text x="600" y="316" font-size="16" font-weight="500" fill="#cbd5e1">어느 학교로 가나</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a2313" stroke="#eda100" stroke-width="3"/>
    <text x="985" y="284" font-size="24" font-weight="800" fill="#f0c96b">입지</text>
    <text x="985" y="316" font-size="16" font-weight="500" fill="#cbd5e1">동네가 어떤가</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 데이터로 보는 수도권 부동산</text>
</svg>
