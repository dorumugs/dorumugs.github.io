<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="QLD 2배 레버리지 ETF 20년 백테스트 — 92.8배, 연복리 25.4%, 최대낙폭 마이너스 83%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="470" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#ffffff" opacity="0.05"/>
  <circle cx="1140" cy="420" r="160" fill="#ffffff" opacity="0.04"/>
  <!-- growth curve with two crash notches (2008, 2022) -->
  <path d="M80 400 L150 360 L210 300 L250 392 L300 410 L360 330 L430 250 L500 200 L560 150 L600 250 L660 300 L700 210 L760 150 L820 110 L900 70 L980 95 L1060 55 L1120 40 L1120 430 L80 430 Z" fill="url(#area)"/>
  <path d="M80 400 L150 360 L210 300 L250 392 L300 410 L360 330 L430 250 L500 200 L560 150 L600 250 L660 300 L700 210 L760 150 L820 110 L900 70 L980 95 L1060 55 L1120 40" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" fill="#ffffff">
    <text x="80" y="92" font-size="30" font-weight="600" opacity="0.85">QLD · 2배 레버리지 나스닥100 ETF</text>
    <text x="74" y="210" font-size="104" font-weight="800" letter-spacing="-2">20년 백테스트</text>
    <text x="80" y="268" font-size="29" opacity="0.92">2006–2026 실측 · 분할 5회 수정종가 반영</text>
    <text x="80" y="340" font-size="40" font-weight="800" fill="#34d399">+92.8배</text>
    <text x="320" y="340" font-size="40" font-weight="800" fill="#fde047">CAGR 25.4%</text>
    <text x="660" y="340" font-size="40" font-weight="800" fill="#f87171">MDD −83%</text>
  </g>
</svg>
