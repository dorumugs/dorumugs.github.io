<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="재무상태표·손익계산서·현금흐름표 3종 읽기와 그 연결 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">재무제표 3종 읽기와 연결 <tspan fill="#93c5fd">(2/4)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">재무상태표·손익계산서·현금흐름표가 한 몸처럼 맞물리는 연결고리까지</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#101d33" stroke="#2563eb" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#93c5fd">재무상태표</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">지금 가진 것과 빚</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1c1533" stroke="#7c3aed" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#c4b5fd">손익계산서</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">한 해 동안 번 것</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0e2a28" stroke="#0d9488" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#5eead4">현금흐름표</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">실제 현금의 들고남</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 재무회계 시리즈 2편 — 만들어진 제표를 읽는 법</text>
</svg>
