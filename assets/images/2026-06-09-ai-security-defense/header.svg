<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="생성형 AI로 SOC 탐지와 대응을 자동화하는 방어 관점 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">AI 탐지·대응 자동화 <tspan fill="#fbbf24">(2/4)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">알람 피로를 줄이는 블루팀 — 트리아지·IOC·탐지룰</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a1a05" stroke="#d97706" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fbbf24">로그 트리아지</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">경보를 구조화 JSON으로</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a1a05" stroke="#f59e0b" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fcd34d">IOC·ATT&amp;CK</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">침해지표·전술 매핑</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a1a05" stroke="#fbbf24" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fde68a">탐지룰 생성</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">Sigma·YARA 초안</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · LLM 으로 SOC 탐지·대응 자동화</text>
</svg>
