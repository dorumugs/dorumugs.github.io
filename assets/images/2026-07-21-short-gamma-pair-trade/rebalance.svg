<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#1a2338"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs><rect width="920" height="430" fill="url(#bg)" rx="14"/><rect x="0" y="0" width="920" height="5" fill="url(#accent)" rx="2"/><text x="28" y="40" fill="#e2e8f0" font-size="21" font-weight="700">숏감마: 2배 ETF의 강제 리밸런싱 흐름</text><text x="28" y="66" fill="#94a3b8" font-size="13">기초자산이 r% 움직이면 → ETF는 같은 방향으로 <tspan fill="#e2e8f0">2·NAV·r</tspan> 만큼 사고팔아야 노출도 2배 유지</text><line x1="90" y1="250" x2="830" y2="250" stroke="#94a3b8" stroke-width="1.5"/><line x1="460.0" y1="120" x2="460.0" y2="380" stroke="#1e293b" stroke-width="1"/><text x="830" y="240" fill="#94a3b8" font-size="12" text-anchor="end">기초자산 일간 수익률 →</text><rect x="476.0" y="150" width="340.0" height="86" rx="10" fill="#34d399" opacity="0.14" stroke="#34d399" stroke-width="1"/><text x="494.0" y="182" fill="#34d399" font-size="16" font-weight="700">▲ 오른 날</text><text x="494.0" y="208" fill="#e2e8f0" font-size="14">더 산다 (비싸게 매수)</text><text x="494.0" y="228" fill="#94a3b8" font-size="12">= 상승을 더 밀어 올림</text><rect x="88.0" y="264" width="356.0" height="86" rx="10" fill="#fb7185" opacity="0.14" stroke="#fb7185" stroke-width="1"/><text x="108" y="296" fill="#fb7185" font-size="16" font-weight="700">▼ 내린 날</text><text x="108" y="322" fill="#e2e8f0" font-size="14">더 판다 (싸게 매도)</text><text x="108" y="342" fill="#94a3b8" font-size="12">= 하락을 더 키움</text><path d="M 468.0 250 L 806 200" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#ag)"/><path d="M 452.0 250 L 114 300" stroke="#fb7185" stroke-width="2" fill="none" marker-end="url(#ar)"/><defs><marker id="ag" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#34d399"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fb7185"/></marker></defs><rect x="70" y="392" width="780" height="0.5" fill="#1e293b"/><text x="460.0" y="414" fill="#fbbf24" font-size="13" text-anchor="middle">삼성·하이닉스 단일종목 레버리지 ETF ≈ 16.3조원 → 5% 급변동 시 하루 ≈ 1.6조원의 강제 매매</text></svg>