<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="유출된 시스템 프롬프트가 공격에 어떻게 쓰이는지 정리한 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">유출된 시스템 프롬프트 <tspan fill="#a78bfa">(1/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">공격자는 이걸로 뭘 할 수 있을까 — 역설계·탈옥·인젝션 정교화</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#1e1233" stroke="#7c3aed" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#a78bfa">숨겨진 자산</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">운영 규칙집이 통째로</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1e1233" stroke="#8b5cf6" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#c4b5fd">5가지 악용</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">역설계·탈옥·인젝션</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#1e1233" stroke="#a78bfa" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#ddd6fe">방어 수칙</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">박을 때 체크리스트</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 유출된 프롬프트, 공격과 방어</text>
</svg>
