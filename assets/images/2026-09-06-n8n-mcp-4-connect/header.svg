<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Claude Code 와 Claude Desktop 에 n8n MCP 서버 붙이고 디버깅하기 4편 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">클라이언트에 <tspan fill="#7dd3fc">붙이고</tspan> 고장 났을 때 찾기</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">claude mcp add · mcp-remote · curl 로 tools/list 찍어보기</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0d1f3c" stroke="#1d4ed8" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#7dd3fc">붙인다</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">http · header · scope</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#b3b4e6">확인한다</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">/mcp · 도구 목록</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7dd3a8">가른다</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">401 · 404 · 406 · 405</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · (4/5) 연결은 3분, 디버깅은 3시간</text>
</svg>
