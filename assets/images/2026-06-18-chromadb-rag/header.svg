    <style>
      .ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="116" font-size="52" font-weight="800" fill="#f8fafc">ChromaDB 로 RAG 제대로 쓰기</text>
  <text class="ko" x="82" y="160" font-size="25" font-weight="500" fill="#9aa6c0">벡터 DB 를 검색 품질까지 끌어올리는 핵심</text>

  <!-- pipeline -->
  <g class="ko" font-size="20" font-weight="800" text-anchor="middle">
    <rect x="80"  y="236" width="168" height="104" rx="16" fill="#1a1f30" stroke="#ffb020" stroke-width="3"/>
    <text x="164" y="288" fill="#ffce6b">문서</text>
    <text x="164" y="318" class="ko" font-size="15" font-weight="500" fill="#cbd5e1">청킹(chunk)</text>

    <rect x="296" y="236" width="168" height="104" rx="16" fill="#241a2e" stroke="#ff6b6b" stroke-width="3"/>
    <text x="380" y="288" fill="#ff9d9d">임베딩</text>
    <text x="380" y="318" class="ko" font-size="15" font-weight="500" fill="#cbd5e1">벡터화</text>

    <rect x="512" y="236" width="176" height="104" rx="16" fill="#241832" stroke="#a855f7" stroke-width="3"/>
    <text x="600" y="284" fill="#cda6f7">ChromaDB</text>
    <text x="600" y="316" class="ko" font-size="15" font-weight="500" fill="#cbd5e1">컬렉션·거리함수</text>

    <rect x="736" y="236" width="168" height="104" rx="16" fill="#15233a" stroke="#3b82f6" stroke-width="3"/>
