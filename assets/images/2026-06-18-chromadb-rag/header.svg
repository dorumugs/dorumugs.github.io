<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="ChromaDB 로 RAG 제대로 쓰기 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141f"/>
      <stop offset="1" stop-color="#1c1430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="0.4" stop-color="#ff6b6b"/>
      <stop offset="0.7" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3b82f6"/>
