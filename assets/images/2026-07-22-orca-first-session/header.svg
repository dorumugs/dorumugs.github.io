<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Orca 에서 저장소 추가부터 worktree·에이전트·분할·diff·ship 까지 첫 3-에이전트 세션 흐름 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">첫 <tspan fill="#fbbf24">3-에이전트</tspan> 세션</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">add → worktree → agent → split → diff → ship, 한 번만 해보면 손에 익어요</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a2110" stroke="#f59e0b" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fbbf24">worktree ×3</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">한 과제, 세 갈래</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a1a12" stroke="#f97316" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fdba74">에이전트 레이싱</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">분할 화면으로 관찰</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a1416" stroke="#ef4444" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fca5a5">diff → ship</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">승자만 커밋·푸시</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Orca 시리즈 2편 — 실전 첫 세션</text>
</svg>
