<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Airflow 를 Helm 으로 K8s 에 올리는 5편 시리즈 개요 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7c8c"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5ec6d6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">Airflow on K8s 개요 <tspan fill="#5ec6d6">(1/5)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">Helm 으로 올리고, 워커는 태스크마다 새 Pod 로 뜬다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#5ec6d6">Helm 차트</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">오브젝트 묶음 설치</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0e2b28" stroke="#14b8a6" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#5eead4">K8s Executor</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">태스크마다 새 Pod</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0d2c2a" stroke="#2dd4bf" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#99f6e4">5편 로드맵</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">설치부터 EKS 까지</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Airflow on K8s 5부작 — 1편 큰 그림</text>
</svg>
