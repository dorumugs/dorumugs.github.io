<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="내부문서 RAG 챗봇 신뢰도 게이트 - 그라운드니스 채점과 골든셋으로 임계값 확정하기 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f1239"/>
      <stop offset="0.5" stop-color="#be123c"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">신뢰도 게이트 — <tspan fill="#fb7185">걸러서 얻는다</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">프롬프트로 부탁한 신뢰도는 보장이 아니다. 채점하고 버린다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2b0f1a" stroke="#9f1239" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fda4af">주장 단위 분해</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">근거와 하나씩 대조</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#31111f" stroke="#be123c" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fb7185">떨어지면 폐기</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">고치지 않는다</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#351323" stroke="#f43f5e" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fecdd3">골든셋으로 측정</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">임베딩과 임계값 확정</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · groundedness · Recall@k · 0.95 / 0.86 캘리브레이션</text>
</svg>
