<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="서울·경기 전용 84제곱미터 구별 중위가격을 가격대별로 묶어 읽는 수도권 지도 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">수도권 전용 84㎡ <tspan fill="#67e8f9">중위가격 지도</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">국토부 실거래로 뽑은 서울 25개 구 + 경기 자치구 중위 매매가, 15개 가격대 그룹</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0c2733" stroke="#0891b2" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#67e8f9">실거래 수집</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">국토부 매매, 3~5월 누적</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#171a33" stroke="#4f46e5" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#a5b4fc">구별 중위가</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">경기 6개 시는 구로 펼침</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0d2a1f" stroke="#059669" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#6ee7b7">가격대 그룹</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">32억~2억, 15개 띠</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 국토부 실거래 데이터 분석 — 2026년 3~5월 누적 기준</text>
</svg>
