<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="국내주식 세금 3종(증권거래세 0.20%, 배당소득세 15.4%, 대주주 양도소득세 22~33%) 비교 배너" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1a2338"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3f2a1e"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="t3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4c1d2e"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- title block -->
  <text x="70" y="86" fill="#e2e8f0" font-size="44" font-weight="700">국내주식 세금 총정리</text>
  <text x="72" y="128" fill="#7dd3fc" font-size="21" font-weight="500" letter-spacing="2">거래세 · 배당세 · 양도세 — 누가 언제 얼마를 내나</text>

  <!-- three taxes as scaled bars (log-ish visual scale) -->
  <line x1="120" y1="372" x2="800" y2="372" stroke="#334155" stroke-width="2"/>

  <rect x="160" y="342" width="150" height="30" rx="6" fill="url(#t1)"/>
  <text x="235" y="332" fill="#bae6fd" font-size="19" font-weight="600" text-anchor="middle">증권거래세</text>
  <text x="235" y="398" fill="#94a3b8" font-size="17" text-anchor="middle">팔 때 · 전원</text>
  <text x="330" y="365" fill="#7dd3fc" font-size="22" font-weight="700">0.20%</text>

  <rect x="420" y="262" width="150" height="110" rx="6" fill="url(#t2)"/>
  <text x="495" y="252" fill="#fde68a" font-size="19" font-weight="600" text-anchor="middle">배당소득세</text>
  <text x="495" y="398" fill="#94a3b8" font-size="17" text-anchor="middle">배당 시 · 전원</text>
  <text x="495" y="325" fill="#0b1220" font-size="24" font-weight="700" text-anchor="middle">15.4%</text>

  <rect x="640" y="192" width="150" height="180" rx="6" fill="url(#t3)"/>
  <text x="715" y="182" fill="#fecdd3" font-size="19" font-weight="600" text-anchor="middle">양도소득세</text>
  <text x="715" y="398" fill="#94a3b8" font-size="17" text-anchor="middle">차익 · 대주주만</text>
  <text x="715" y="290" fill="#0b1220" font-size="24" font-weight="700" text-anchor="middle">22~33%</text>

  <!-- right panel -->
  <rect x="850" y="180" width="290" height="200" rx="12" fill="#0b1220" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="995" y="218" fill="#7dd3fc" font-size="20" font-weight="700" text-anchor="middle">2026 체크포인트</text>
  <text x="875" y="256" fill="#cbd5e1" font-size="17">거래세 0.20% 로 환원</text>
  <text x="875" y="288" fill="#cbd5e1" font-size="17">금투세 — 시행 전 폐지</text>
  <text x="875" y="320" fill="#cbd5e1" font-size="17">고배당 분리과세 신설</text>
  <text x="875" y="352" fill="#94a3b8" font-size="16">소액주주 차익은 여전히 비과세</text>

  <text x="72" y="402" fill="#64748b" font-size="16">주식 세금 완전정리 (1/3) — KayserDocs</text>
</svg>
