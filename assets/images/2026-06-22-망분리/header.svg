<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>

  <!-- title -->
  <text x="60" y="78" fill="#f8fafc" font-size="40" font-weight="800">금융권 망분리 — 내부망과 외부망</text>
  <text x="60" y="116" fill="#94a3b8" font-size="21" font-weight="500">왜 갈랐고, 지금은 왜 푸는가 · 물리적 분리에서 다층보안으로</text>

  <!-- 내부망 zone -->
  <rect x="60" y="170" width="370" height="250" rx="18" fill="url(#inner)" opacity="0.92"/>
  <text x="245" y="214" fill="#dbeafe" font-size="22" font-weight="700" text-anchor="middle">내부망 (업무망)</text>
  <text x="245" y="250" fill="#bfdbfe" font-size="15" text-anchor="middle">전산실 · 코어뱅킹 · 고객정보</text>
  <rect x="110" y="285" width="120" height="78" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="170" y="330" fill="#dbeafe" font-size="14" text-anchor="middle">정보처리시스템</text>
  <rect x="262" y="285" width="120" height="78" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="322" y="330" fill="#dbeafe" font-size="14" text-anchor="middle">운영·개발 단말</text>
  <text x="245" y="400" fill="#93c5fd" font-size="14" text-anchor="middle">🔒 인터넷 차단 · 매체제어</text>

  <!-- gateway -->
  <rect x="500" y="232" width="200" height="126" rx="16" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="282" fill="#fde68a" font-size="18" font-weight="700" text-anchor="middle">망연계 / 방화벽</text>
  <text x="600" y="312" fill="#fcd34d" font-size="14" text-anchor="middle">통제된 통로</text>
  <text x="600" y="334" fill="#fcd34d" font-size="14" text-anchor="middle">만 허용</text>
  <!-- arrows -->
  <path d="M 432 295 L 498 295" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M 702 295 L 768 295" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- 외부망 zone -->
  <rect x="770" y="170" width="370" height="250" rx="18" fill="url(#outer)" opacity="0.92"/>
  <text x="955" y="214" fill="#ccfbf1" font-size="22" font-weight="700" text-anchor="middle">외부망 (인터넷망)</text>
  <text x="955" y="250" fill="#99f6e4" font-size="15" text-anchor="middle">웹 · 메일 · SaaS · 생성형 AI</text>
  <rect x="820" y="285" width="120" height="78" rx="10" fill="#115e59" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="880" y="330" fill="#ccfbf1" font-size="14" text-anchor="middle">인터넷 단말</text>
  <rect x="972" y="285" width="120" height="78" rx="10" fill="#115e59" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="1032" y="322" fill="#ccfbf1" font-size="14" text-anchor="middle">클라우드</text>
  <text x="1032" y="342" fill="#ccfbf1" font-size="14" text-anchor="middle">SaaS / AI</text>
  <text x="955" y="400" fill="#5eead4" font-size="14" text-anchor="middle">🌐 대외 통신 · 신기술</text>

  <!-- bottom band -->
  <text x="600" y="462" fill="#cbd5e1" font-size="16" text-anchor="middle">2013 물리적 망분리 의무화  →  2024 개선 로드맵  →  자율보안 · 결과책임 · 다층보안(MLS)</text>
</svg>
