<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="ed25519 SSH 키를 만들어 GitHub 에 등록하는 과정 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7c8c"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#6264a7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">GitHub SSH 키 등록 <tspan fill="#5ec6d6">(1/2)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">ed25519 키 한 짝으로 GitHub 인증과 서버 접근까지 통일</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#5ec6d6">ed25519 생성</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">ssh-keygen 한 줄</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#16233f" stroke="#2563eb" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#93c5fd">GitHub 등록</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">공개키 붙여넣기</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#b3b4e6">SSH 리모트</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">HTTPS → SSH 전환</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · SSH 시리즈 1편, 키 만들고 GitHub 에 등록하기</text>
</svg>
