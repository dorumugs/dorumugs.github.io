<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="에이전트 실행단에서 권한을 통제하는 운영 방어 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701a75"/>
      <stop offset="0.5" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">실행단 권한 통제 <tspan fill="#e879f9">(3/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">필터가 뚫려도 피해가 안 나게 — 서버검증·최소권한·사람승인</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#240a26" stroke="#c026d3" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#e879f9">서버측 검증</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">모델 결정을 재검사</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#240a26" stroke="#d946ef" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#f0abfc">최소 권한</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">도구 권한 최소화</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#240a26" stroke="#e879f9" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#f5d0fe">사람 승인</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">감사 로그·휴먼검토</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 모델은 신뢰 경계 밖, 서버가 검증</text>
</svg>
