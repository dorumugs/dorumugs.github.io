<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="ChromaDB 를 Docker 로 운영하기 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1422"/>
      <stop offset="1" stop-color="#101f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2496ed"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <style>
      .ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="116" font-size="50" font-weight="800" fill="#f8fafc">ChromaDB 를 Docker 로 운영하기</text>
  <text class="ko" x="82" y="160" font-size="24" font-weight="500" fill="#9aa6c0">서버 모드 · 볼륨 · 인증 · 백업까지</text>

  <!-- container with mounted volume -->
  <g class="ko" text-anchor="middle">
    <rect x="80" y="232" width="300" height="116" rx="18" fill="#0e2236" stroke="#2496ed" stroke-width="3"/>
    <text x="230" y="278" font-size="22" font-weight="800" fill="#7fc3f5">chroma 컨테이너</text>
    <text x="230" y="312" font-size="15" font-weight="500" fill="#cbd5e1">:8000 · HttpClient</text>

    <rect x="452" y="232" width="284" height="116" rx="18" fill="#102a26" stroke="#22d3ee" stroke-width="3"/>
    <text x="594" y="278" font-size="22" font-weight="800" fill="#6fe3ef">볼륨 마운트</text>
    <text x="594" y="312" font-size="15" font-weight="500" fill="#cbd5e1">/chroma/chroma · 영속</text>

    <rect x="808" y="232" width="312" height="116" rx="18" fill="#21162e" stroke="#a855f7" stroke-width="3"/>
    <text x="964" y="278" font-size="22" font-weight="800" fill="#cda6f7">인증 · 백업</text>
    <text x="964" y="312" font-size="15" font-weight="500" fill="#cbd5e1">토큰 · 스냅샷</text>
  </g>

  <g fill="#64748b" font-size="30" font-weight="800">
    <text x="404" y="298">›</text>
    <text x="760" y="298">›</text>
  </g>

  <text class="ko" x="80" y="392" font-size="18" fill="#6b7689">KayserDocs · docker-compose 로 선언적으로 띄우고 데이터를 지키기</text>
</svg>
