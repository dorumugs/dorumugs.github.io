<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="AI IDE 와 Claude Code 하이브리드 셋업 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#be123c"/>
      <stop offset="0.5" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">AI IDE × Claude Code 하이브리드 <tspan fill="#fb7185">(3/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">Antigravity · Cursor 에 Claude Code 끼워 쓰는 역할 분담 셋업</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a0f18" stroke="#be123c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fb7185">역할 분담</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">IDE 관제 · CLI 작업</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a170d" stroke="#c2410c" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fdba74">MCP 공유</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">룰 · 스킬 · 자격증명 분리</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a0f18" stroke="#be123c" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fb7185">워크플로우</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">실전 시나리오 4가지</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · AI IDE 현업 활용 시리즈 마무리</text>
</svg>
