<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="LLM Fine Tuning 용 데이터를 만드는 과정 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">Fine Tuning 데이터 만들기 <tspan fill="#c4b5fd">(3/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">PDF 에서 QA Pair 를 뽑아 JSONL 데이터셋으로 다듬기</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#201a33" stroke="#8b5cf6" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#c4b5fd">PDF 로드</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">unstructured 전처리</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#241a38" stroke="#a855f7" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#d8b4fe">QA Pair 생성</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">LLM 으로 질문·답변</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a1832" stroke="#d946ef" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#f0abfc">JSONL 업로드</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">Huggingface Hub 등록</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · LangChain 입문 시리즈 3편</text>
</svg>
