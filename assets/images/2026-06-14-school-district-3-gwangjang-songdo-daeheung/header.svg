<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="신흥·도심접근 학군 광장동·송도·대흥의 학군 수요와 실거래 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#be123c"/>
      <stop offset="0.5" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">신흥·도심 학군 <tspan fill="#fda4af">(3/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">광장동·송도·대흥 — 전통 학군 밖에서 가격을 떠받치는 학군 수요</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2b0e18" stroke="#be123c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fda4af">광장동</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">광남학군·한강</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#300f1b" stroke="#e11d48" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fdbac3">송도</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">1공구 국제도시</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#33101d" stroke="#fb7185" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fecdd3">대흥</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">직주근접 신축</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 학군지 시리즈 3/3</text>
</svg>
