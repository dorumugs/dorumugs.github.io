<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="AWS Bedrock 챗봇에서 대화 맥락을 유지하는 네 개의 층 — 세션 스토어, 프롬프트 캐싱, 컨텍스트 관리, 장기 기억 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="104" font-size="41" font-weight="800" fill="#f8fafc">Bedrock 챗봇의 <tspan fill="#a78bfa">맥락 유지 4층</tspan></text>
  <text class="ko" x="82" y="148" font-size="22" font-weight="500" fill="#94a3b8">모델은 아무것도 기억하지 않아요. 기억은 전부 우리가 설계합니다.</text>

  <g class="ko" text-anchor="middle">
    <rect x="70"  y="222" width="248" height="124" rx="16" fill="#10233a" stroke="#38bdf8" stroke-width="3"/>
    <text x="194" y="264" font-size="20" font-weight="800" fill="#7dd3fc">1. 세션 스토어</text>
    <text x="194" y="296" font-size="15" font-weight="500" fill="#cbd5e1">대화를 어디에 쌓나</text>
    <text x="194" y="322" font-size="14" font-weight="500" fill="#64748b">DynamoDB · 블록 원문</text>

    <rect x="348" y="222" width="248" height="124" rx="16" fill="#1b1a33" stroke="#818cf8" stroke-width="3"/>
    <text x="472" y="264" font-size="20" font-weight="800" fill="#a5b4fc">2. 프롬프트 캐싱</text>
    <text x="472" y="296" font-size="15" font-weight="500" fill="#cbd5e1">싸게 다시 보내기</text>
    <text x="472" y="322" font-size="14" font-weight="500" fill="#64748b">prefix 일치 · 재사용</text>

    <rect x="626" y="222" width="248" height="124" rx="16" fill="#231a30" stroke="#c084fc" stroke-width="3"/>
    <text x="750" y="264" font-size="20" font-weight="800" fill="#d8b4fe">3. 컨텍스트 관리</text>
    <text x="750" y="296" font-size="15" font-weight="500" fill="#cbd5e1">넘칠 때 줄이기</text>
    <text x="750" y="322" font-size="14" font-weight="500" fill="#64748b">압축 · 정리 · 요약</text>

    <rect x="904" y="222" width="226" height="124" rx="16" fill="#0f2a22" stroke="#22c55e" stroke-width="3"/>
    <text x="1017" y="264" font-size="20" font-weight="800" fill="#86efac">4. 장기 기억</text>
    <text x="1017" y="296" font-size="15" font-weight="500" fill="#cbd5e1">세션을 넘어서</text>
    <text x="1017" y="322" font-size="14" font-weight="500" fill="#64748b">요약 카드 · 검색</text>
  </g>

  <text class="ko" x="80" y="392" font-size="16" font-weight="500" fill="#475569">AnthropicBedrockMantle · anthropic.claude-opus-5 · 스테이트리스 Messages API</text>
</svg>
