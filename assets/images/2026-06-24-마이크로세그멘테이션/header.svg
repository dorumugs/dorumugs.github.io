<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="allow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#34d399"/>
    </marker>
    <marker id="deny" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>

  <text x="60" y="74" fill="#f8fafc" font-size="40" font-weight="800">마이크로세그멘테이션 실전</text>
  <text x="60" y="112" fill="#94a3b8" font-size="21" font-weight="500">한 덩어리 내부를 잘게 쪼개 횡적 이동을 끊는다 · default-deny + allowlist</text>

  <!-- left: flat network -->
  <text x="245" y="178" fill="#cbd5e1" font-size="17" font-weight="700" text-anchor="middle">평평한 내부망</text>
  <rect x="80" y="195" width="330" height="200" rx="16" fill="#1f2937" stroke="#475569" stroke-width="1.5"/>
  <circle cx="160" cy="260" r="26" fill="#334155" stroke="#64748b"/>
  <circle cx="330" cy="260" r="26" fill="#334155" stroke="#64748b"/>
  <circle cx="160" cy="345" r="26" fill="#334155" stroke="#64748b"/>
  <circle cx="330" cy="345" r="26" fill="#334155" stroke="#64748b"/>
  <!-- red lateral arrows (free movement) -->
  <path d="M 186 260 L 304 260" stroke="#f87171" stroke-width="2.2" marker-end="url(#deny)"/>
  <path d="M 160 286 L 160 319" stroke="#f87171" stroke-width="2.2" marker-end="url(#deny)"/>
  <path d="M 330 286 L 330 319" stroke="#f87171" stroke-width="2.2" marker-end="url(#deny)"/>
  <path d="M 184 278 L 306 327" stroke="#f87171" stroke-width="2.2" marker-end="url(#deny)"/>
  <text x="245" y="385" fill="#fca5a5" font-size="13" text-anchor="middle">한 곳 뚫리면 옆으로 자유롭게 번짐</text>

  <!-- arrow between -->
  <path d="M 430 295 L 500 295" stroke="#fbbf24" stroke-width="3.5" marker-end="url(#allow)"/>
  <text x="465" y="280" fill="#fcd34d" font-size="13" text-anchor="middle">분할</text>

  <!-- right: segmented -->
  <text x="855" y="178" fill="#cbd5e1" font-size="17" font-weight="700" text-anchor="middle">세그먼트로 분할</text>
  <!-- web -->
  <rect x="525" y="220" width="170" height="150" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="610" y="252" fill="#e0f2fe" font-size="15" font-weight="700" text-anchor="middle">web</text>
  <circle cx="610" cy="305" r="24" fill="#075985" stroke="#7dd3fc"/>
  <!-- api -->
  <rect x="715" y="220" width="170" height="150" rx="12" fill="#3730a3" stroke="#818cf8" stroke-width="1.6"/>
  <text x="800" y="252" fill="#e0e7ff" font-size="15" font-weight="700" text-anchor="middle">api</text>
  <circle cx="800" cy="305" r="24" fill="#312e81" stroke="#a5b4fc"/>
  <!-- db -->
  <rect x="905" y="220" width="170" height="150" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="1.6"/>
  <text x="990" y="252" fill="#d1fae5" font-size="15" font-weight="700" text-anchor="middle">db</text>
  <circle cx="990" cy="305" r="24" fill="#065f46" stroke="#6ee7b7"/>
  <!-- allow chain -->
  <path d="M 634 305 L 776 305" stroke="#34d399" stroke-width="2.6" marker-end="url(#allow)"/>
  <text x="705" y="295" fill="#6ee7b7" font-size="11.5" text-anchor="middle">:8080</text>
  <path d="M 824 305 L 966 305" stroke="#34d399" stroke-width="2.6" marker-end="url(#allow)"/>
  <text x="895" y="295" fill="#6ee7b7" font-size="11.5" text-anchor="middle">:5432</text>
  <!-- blocked lateral (web->db) -->
  <path d="M 620 332 C 720 410, 900 410, 982 332" stroke="#f87171" stroke-width="2.4" stroke-dasharray="6 5" fill="none" marker-end="url(#deny)"/>
  <text x="800" y="408" fill="#fca5a5" font-size="12.5" text-anchor="middle">web → db 직접 접근은 차단 (횡적 이동 ✕)</text>

  <text x="600" y="470" fill="#cbd5e1" font-size="15" text-anchor="middle">흐름을 그리고 → 기본 차단 → 허용만 열고 → 관찰에서 시행으로</text>
</svg>
