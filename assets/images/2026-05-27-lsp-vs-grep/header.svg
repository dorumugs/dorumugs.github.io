<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="AI 코딩 에이전트의 코드 탐색에서 LSP 와 grep 을 비교하는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#217346"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">LSP vs grep — AI 에이전트의 코드 탐색</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">텍스트 매칭과 의미 기반 탐색, AI 에이전트는 뭘 써야 할까</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2b1d0e" stroke="#d97706" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fbbf24">grep</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">빠른 텍스트 매칭</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0c2233" stroke="#0284c7" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#7dd3fc">LSP</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">구조와 의미 이해</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7dd3a8">AI 에이전트</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">상황 따라 골라 쓰기</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · AI 코딩 에이전트의 코드 탐색 도구 이야기</text>
</svg>
