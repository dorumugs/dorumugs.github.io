<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="오픈웨이트 코딩 모델을 대형 MoE·중형 Dense·소형 로컬 세 티어로 나눠 에이전트급을 고르는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120b20"/>
      <stop offset="1" stop-color="#1c1436"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="108" font-size="43" font-weight="800" fill="#f8fafc">어떤 <tspan fill="#c084fc">오픈웨이트</tspan>가 코딩 에이전트급인가</text>
  <text class="ko" x="82" y="152" font-size="23" font-weight="500" fill="#a99bc4">에이전틱 벤치 · 툴 콜 · 긴 컨텍스트로 티어를 가르기</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="228" width="330" height="128" rx="16" fill="#231338" stroke="#a855f7" stroke-width="3"/>
    <text x="255" y="272" font-size="22" font-weight="800" fill="#d8b4fe">대형 MoE</text>
    <text x="255" y="304" font-size="16" font-weight="500" fill="#cbd5e1">프런티어 근접 · 에이전트급</text>
    <text x="255" y="330" font-size="15" font-weight="500" fill="#94a3b8">멀티 GPU 노드 필요</text>

    <rect x="435" y="228" width="330" height="128" rx="16" fill="#2a1530" stroke="#ec4899" stroke-width="3"/>
    <text x="600" y="272" font-size="22" font-weight="800" fill="#f9a8d4">중형 Dense</text>
    <text x="600" y="304" font-size="16" font-weight="500" fill="#cbd5e1">준수 · 특정 언어 강함</text>
    <text x="600" y="330" font-size="15" font-weight="500" fill="#94a3b8">GPU 1~2장 탑재</text>

    <rect x="780" y="228" width="330" height="128" rx="16" fill="#2c2312" stroke="#f59e0b" stroke-width="3"/>
    <text x="945" y="272" font-size="22" font-weight="800" fill="#fbbf24">소형 로컬</text>
    <text x="945" y="304" font-size="16" font-weight="500" fill="#cbd5e1">보조 · 자동완성용</text>
    <text x="945" y="330" font-size="15" font-weight="500" fill="#94a3b8">워크스테이션급</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#7c6f93">KayserDocs · 예산이 허용하는 VRAM 에서 최대 티어를 역산</text>
</svg>
