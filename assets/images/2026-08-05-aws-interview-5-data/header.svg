<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="수집에서 S3 데이터 레이크, 가공, 분석과 Bedrock 서빙으로 이어지는 데이터 흐름과 60분 면접 시간 배분 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08170f"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="98" font-size="41" font-weight="800" fill="#f8fafc">데이터 · AI 플랫폼 <tspan fill="#34d399">+ 60분 진행표</tspan></text>
  <text class="ko" x="82" y="140" font-size="22" font-weight="500" fill="#94a3b8">파이프라인은 만드는 것보다 다시 돌리는 게 어렵습니다.</text>

  <g class="ko" text-anchor="middle">
    <rect x="70" y="186" width="188" height="96" rx="14" fill="#0f2a22" stroke="#22c55e" stroke-width="3"/>
    <text x="164" y="222" font-size="19" font-weight="800" fill="#86efac">수집</text>
    <text x="164" y="252" font-size="14" font-weight="500" fill="#94a3b8">Kinesis · 배치</text>

    <rect x="288" y="186" width="188" height="96" rx="14" fill="#0f2a22" stroke="#34d399" stroke-width="3"/>
    <text x="382" y="222" font-size="19" font-weight="800" fill="#6ee7b7">저장</text>
    <text x="382" y="252" font-size="14" font-weight="500" fill="#94a3b8">S3 레이크 · Parquet</text>

    <rect x="506" y="186" width="188" height="96" rx="14" fill="#0f2a26" stroke="#2dd4bf" stroke-width="3"/>
    <text x="600" y="222" font-size="19" font-weight="800" fill="#5eead4">가공</text>
    <text x="600" y="252" font-size="14" font-weight="500" fill="#94a3b8">Glue · Airflow</text>

    <rect x="724" y="186" width="188" height="96" rx="14" fill="#0f2333" stroke="#38bdf8" stroke-width="3"/>
    <text x="818" y="222" font-size="19" font-weight="800" fill="#7dd3fc">분석</text>
    <text x="818" y="252" font-size="14" font-weight="500" fill="#94a3b8">Athena · Redshift</text>

    <rect x="942" y="186" width="188" height="96" rx="14" fill="#1e1a33" stroke="#a78bfa" stroke-width="3"/>
    <text x="1036" y="222" font-size="19" font-weight="800" fill="#c4b5fd">서빙</text>
    <text x="1036" y="252" font-size="14" font-weight="500" fill="#94a3b8">Bedrock · RAG</text>
  </g>

  <g stroke="#334155" stroke-width="3">
    <line x1="262" y1="234" x2="282" y2="234"/>
    <line x1="480" y1="234" x2="500" y2="234"/>
    <line x1="698" y1="234" x2="718" y2="234"/>
    <line x1="916" y1="234" x2="936" y2="234"/>
  </g>

  <g class="ko">
    <rect x="70" y="316" width="1060" height="44" rx="10" fill="#0d1a15" stroke="#166534" stroke-width="2"/>
    <text x="88" y="345" font-size="16" font-weight="600" fill="#86efac">60분 배분 — 인사 5분 · 공통 10분 · 심화 25분 · 실패 이야기 10분 · 후보자 질문 5분 · 마무리 5분</text>
  </g>

  <text class="ko" x="80" y="394" font-size="16" font-weight="500" fill="#475569">스캔한 만큼 돈이 나가는 구조 — 파티셔닝과 파일 포맷이 곧 비용입니다</text>
</svg>
