<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="GitHub 를 처음 쓰는 사람을 위한 기본 사용법 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f05033"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">간단하게 이해하는 <tspan fill="#fda4af">GitHub</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">작은 커밋 습관부터 브랜치 전략, Pull Request 협업까지</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2b1712" stroke="#f05033" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fda4af">작은 커밋</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">의미 있는 메시지</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#201a33" stroke="#8b5cf6" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#c4b5fd">브랜치 전략</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">rebase vs merge</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#2ea043" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7dd3a8">Pull Request</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">코드 리뷰로 협업</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Git/GitHub 입문 가이드</text>
</svg>
