<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="11~16억으로 서울에 처음 입성하는 평형·지역 전략 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">11~16억, 서울 입성 <tspan fill="#93c5fd">(3/5)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">핵심지 59㎡ vs 차상위 84㎡ — 동작·동대문·성동·강동·광진</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#121f3a" stroke="#2563eb" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#93c5fd">59㎡ 핵심지</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">같은 돈, 더 좋은 입지</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#13234a" stroke="#3b82f6" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#a8cdfd">84㎡ 차상위</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">한 급지 아래 넓은 집</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#142850" stroke="#60a5fa" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#bfdbfe">교두보 잡기</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">노량진 옆 바뀌는 자리</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 입지 갈아타기 로드맵 3/5</text>
</svg>
