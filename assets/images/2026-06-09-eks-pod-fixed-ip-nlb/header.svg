<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="EKS 파드 고정 IP 를 위한 Service 와 NLB Elastic IP 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#326ce5"/>
      <stop offset="0.5" stop-color="#0a7c8c"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">EKS 파드, 고정 <tspan fill="#93c5fd">IP</tspan> 로 부르려면?</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">파드 IP 는 직접 보지 말 것 — 안은 Service, 밖은 NLB + Elastic IP</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#101f3d" stroke="#326ce5" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#93c5fd">파드 IP 변동</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">재시작마다 새 IP</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#5ec6d6">Service</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">변하지 않는 대표 주소</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2b1d0a" stroke="#d97706" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fbbf24">NLB + EIP</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">외부용 진짜 고정 IP</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · EKS 네트워크 입문 — 파드 앞에 대표 주소 두기</text>
</svg>
