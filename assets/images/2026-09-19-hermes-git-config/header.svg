<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Hermes 에이전트 자체의 설정을 비밀 유출 없이 Git 으로 형상관리하는 과정 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">Hermes 자체를 <tspan fill="#fdba74">Git</tspan> 으로 형상관리</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">632M 중에 7.2M 만 — 나머지는 비밀이거나 다시 만들어진다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2b1a0e" stroke="#f97316" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fdba74">전부 무시</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">화이트리스트 시작</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2b0f1a" stroke="#e11d48" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fda4af">비밀 거르기</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">clean 필터 · 훅</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#1e1633" stroke="#8b5cf6" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#c4b5fd">복원 리허설</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">되돌려봐야 백업</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 2편 — config.yaml 은 깨끗하지 않다</text>
</svg>
