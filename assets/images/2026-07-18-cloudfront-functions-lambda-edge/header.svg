<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="CloudFront Functions 와 Lambda@Edge 가 요청·응답의 어느 지점에서 실행되는지 비교하는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#151033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="44" font-weight="800" fill="#f8fafc">엣지에서 <tspan fill="#a78bfa">요청을 주무르기</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">CloudFront Functions vs Lambda@Edge — 어디서 실행되고 언제 쓰나</text>

  <g class="ko" text-anchor="middle" font-size="15" font-weight="600" fill="#cbd5e1">
    <rect x="70"  y="250" width="150" height="70" rx="12" fill="#101a2e" stroke="#1d4ed8" stroke-width="2"/>
    <text x="145" y="292" fill="#93c5fd">사용자</text>

    <rect x="330" y="250" width="180" height="70" rx="12" fill="#1b1440" stroke="#7c3aed" stroke-width="2"/>
    <text x="420" y="284" fill="#c4b5fd">Viewer Request</text>
    <text x="420" y="306" font-size="13" fill="#94a3b8">CF Functions</text>

    <rect x="620" y="250" width="150" height="70" rx="12" fill="#0f2137" stroke="#38bdf8" stroke-width="2"/>
    <text x="695" y="292" fill="#7dd3fc">Edge 캐시</text>

    <rect x="880" y="250" width="180" height="70" rx="12" fill="#132a1c" stroke="#f59e0b" stroke-width="2"/>
    <text x="970" y="284" fill="#fbbf24">Origin Request</text>
    <text x="970" y="306" font-size="13" fill="#94a3b8">Lambda@Edge</text>
  </g>

  <line x1="222" y1="285" x2="326" y2="285" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="512" y1="285" x2="616" y2="285" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="772" y1="285" x2="876" y2="285" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="392" font-size="18" fill="#64748b">KayserDocs · 가벼운 건 Functions, 무거운 건 Lambda@Edge</text>
</svg>
