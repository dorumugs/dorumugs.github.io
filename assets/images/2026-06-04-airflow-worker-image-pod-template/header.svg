<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Airflow 워커 이미지 빌드와 pod_template_file 스펙 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">Airflow 워커 이미지 <tspan fill="#c4b5fd">(3/5)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">Dockerfile 로 굽고 pod_template_file 로 스펙을 잡는다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#1b1533" stroke="#7c3aed" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#c4b5fd">Dockerfile</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">의존성 얹은 이미지</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#191333" stroke="#8b5cf6" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#ddd6fe">빌드·푸시</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">values 에 태그 반영</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#170f2e" stroke="#6d28d9" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#c4b5fd">pod_template</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">리소스·볼륨 스펙</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Airflow on K8s 5부작 — 3편 워커 이미지</text>
</svg>
