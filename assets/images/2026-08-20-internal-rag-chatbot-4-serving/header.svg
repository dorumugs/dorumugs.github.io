<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="내부문서 RAG 챗봇 서빙 경로 - ES 하이브리드 검색과 리랭커, Redis 3단 게이트 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0369a1"/>
      <stop offset="0.5" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">서빙 경로 — <tspan fill="#7dd3fc">3단 게이트</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">확실하면 즉답, 애매하면 힌트로 강등해서 RAG 에 넘긴다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0a1f2e" stroke="#0369a1" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#7dd3fc">BM25 + dense</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">RRF 로 섞어 top-50</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0b2436" stroke="#0284c7" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#38bdf8">리랭커</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">50개를 5개로</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0d2a3d" stroke="#38bdf8" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#bae6fd">게이트 판정</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">즉답 · 힌트 · 순수</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 벡터는 ES 에만, Redis 는 exact 캐시로</text>
</svg>
