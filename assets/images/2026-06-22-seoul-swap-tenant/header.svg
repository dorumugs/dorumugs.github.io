<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="세 낀 집을 팔고 갈아타기 — 매수자도 실거주 의무, 임대차 갱신청구권 시계, 양도세 거주요건 빵꾸 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#241a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a14a6b"/>
      <stop offset="0.5" stop-color="#6264a7"/>
      <stop offset="1" stop-color="#0a7c8c"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">세 낀 집을 팔고 <tspan fill="#e493b3">갈아타기</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">세입자·보증금·거주요건이 꼬이는 세 지점</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="320" height="118" rx="16" fill="#2a1622" stroke="#a14a6b" stroke-width="3"/>
    <text x="250" y="284" font-size="22" font-weight="800" fill="#e493b3">① 세입자</text>
    <text x="250" y="318" font-size="16" font-weight="500" fill="#cbd5e1">매수자도 실거주 의무</text>
    <rect x="440" y="236" width="320" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="284" font-size="22" font-weight="800" fill="#b3b4e6">② 시계</text>
    <text x="600" y="318" font-size="16" font-weight="500" fill="#cbd5e1">갱신청구권 6~2개월</text>
    <rect x="790" y="236" width="320" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="950" y="284" font-size="22" font-weight="800" fill="#5ec6d6">③ 세금</text>
    <text x="950" y="318" font-size="16" font-weight="500" fill="#cbd5e1">거주요건 빵꾸 주의</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 세입자를 못 내보내면 매도도 입주도 막힌다</text>
</svg>
