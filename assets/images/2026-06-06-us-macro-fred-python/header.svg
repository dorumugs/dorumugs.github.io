<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="미국 거시 지표를 FRED 와 Python 으로 받아오는 방법 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#6264a7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">미국 거시 지표 가져오기 <tspan fill="#93c5fd">(1/2)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">CPI · PCE · 고용 · 금리 · VIX — 1차 출처와 FRED · yfinance 수집</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#101c33" stroke="#2563eb" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#93c5fd">4묶음 지도</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">인플레·고용·성장·금리</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0c2733" stroke="#0891b2" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#67e8f9">1차 출처</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">BLS · BEA · 연준 원본</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#b3b4e6">Python 수집</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">fredapi · yfinance</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 거시 지표 시리즈 1편</text>
</svg>
