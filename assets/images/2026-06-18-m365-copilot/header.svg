<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Microsoft 365 Copilot 앱별 활용 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b579a"/>
      <stop offset="0.35" stop-color="#217346"/>
      <stop offset="0.6" stop-color="#d24726"/>
      <stop offset="1" stop-color="#6264a7"/>
    </linearGradient>
    <style>
      .ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="118" font-size="52" font-weight="800" fill="#f8fafc">Microsoft 365 Copilot</text>
  <text class="ko" x="82" y="162" font-size="25" font-weight="500" fill="#94a3b8">앱별로 무엇을 어디까지 시킬 수 있나</text>

  <!-- 5 app tiles -->
  <g class="ko" font-size="22" font-weight="800" text-anchor="middle">
    <rect x="80"  y="232" width="195" height="112" rx="16" fill="#13233f" stroke="#2b579a" stroke-width="3"/>
    <text x="177" y="288" fill="#93b4e6">Word</text>
    <text x="177" y="320" class="ko" font-size="16" font-weight="500" fill="#cbd5e1">초안·요약</text>

    <rect x="295" y="232" width="195" height="112" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="392" y="288" fill="#7dd3a8">Excel</text>
    <text x="392" y="320" class="ko" font-size="16" font-weight="500" fill="#cbd5e1">분석·수식</text>

    <rect x="510" y="232" width="195" height="112" rx="16" fill="#2a1812" stroke="#d24726" stroke-width="3"/>
    <text x="607" y="288" fill="#f0a98c">PowerPoint</text>
    <text x="607" y="320" class="ko" font-size="16" font-weight="500" fill="#cbd5e1">슬라이드</text>

    <rect x="725" y="232" width="195" height="112" rx="16" fill="#10202f" stroke="#0072c6" stroke-width="3"/>
    <text x="822" y="288" fill="#7cc3f0">Outlook</text>
    <text x="822" y="320" class="ko" font-size="16" font-weight="500" fill="#cbd5e1">메일·일정</text>

    <rect x="940" y="232" width="180" height="112" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="1030" y="288" fill="#b3b4e6">Teams</text>
    <text x="1030" y="320" class="ko" font-size="16" font-weight="500" fill="#cbd5e1">회의 요약</text>
  </g>

  <text class="ko" x="80" y="392" font-size="18" fill="#64748b">KayserDocs · 내 문서·메일·회의에 근거해 일을 시키는 법</text>
</svg>
