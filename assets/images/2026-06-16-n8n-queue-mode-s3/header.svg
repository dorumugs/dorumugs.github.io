<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="n8n 일반 모드와 큐 모드 비교, 그리고 큐모드가 S3 를 쓰는 이유 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea4b71"/>
      <stop offset="0.5" stop-color="#d8552c"/>
      <stop offset="1" stop-color="#569a31"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">n8n 일반 모드 vs <tspan fill="#f28ba3">큐 모드</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">세팅과 장단점, 그리고 큐모드가 바이너리에 S3 를 쓰는 이유</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2b141c" stroke="#ea4b71" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#f28ba3">main 인스턴스</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">UI · API · 트리거 담당</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2b1913" stroke="#d8552c" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#eb9573">Redis 큐 · 워커</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">실행을 워커로 분산</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#16250f" stroke="#569a31" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#9ed177">S3 바이너리</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">워커 간 파일 공유</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · n8n 셀프호스팅 스케일링 가이드</text>
</svg>
