<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Docker 는 워커, Kubernetes 는 오케스트레이터라는 관계 정리 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">Docker 와 <tspan fill="#a5b4fc">K8s</tspan> 의 관계</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">한 노드의 워커, 그리고 워커들을 부리는 오케스트레이터</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0c2231" stroke="#0ea5e9" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#7dd3fc">Docker</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">한 노드 위의 워커</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#171a38" stroke="#6366f1" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#a5b4fc">K8s</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">클러스터 오케스트레이터</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0d2a20" stroke="#10b981" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#6ee7b7">만나는 지점</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">OCI · CRI · containerd</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Docker 와 K8s 관계 입문</text>
</svg>
