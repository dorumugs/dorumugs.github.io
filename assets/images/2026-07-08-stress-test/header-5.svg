<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="홈페이지 스트레스 테스트 5편 복원력 카오스 엔지니어링 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#260c0c"/>
      <stop offset="1" stop-color="#3d1414"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.5" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a86b6b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <rect x="1020" y="36" width="100" height="40" rx="20" fill="#2f0e0e" stroke="#dc2626" stroke-width="2"/>
  <text class="ko" x="1070" y="63" font-size="20" font-weight="800" fill="#fb7185" text-anchor="middle">5 / 6</text>

  <text class="ko" x="80" y="112" font-size="44" font-weight="800" fill="#f8fafc">홈페이지 스트레스 테스트 <tspan fill="#fb7185">복원력</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#c69494">부하가 아니라 장애를 견디는 힘 — 일부러 고장을 주입한다</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2f0e0e" stroke="#dc2626" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fb7185">타임아웃</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#e1c4c4">느린 의존성 끊기</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a1614" stroke="#c0603d" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#f0a078">서킷브레이커</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#e1c4c4">죽은 곳 호출 차단</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a1020" stroke="#c03d7a" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#f08fc0">폴백</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#e1c4c4">대체 응답 제공</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#a86b6b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#a86b6b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#8a5a5a">KayserDocs · 폭발 반경을 좁게, 중단 스위치 먼저, 스테이징에서 먼저</text>
</svg>
