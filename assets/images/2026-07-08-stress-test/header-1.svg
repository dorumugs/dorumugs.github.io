<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="홈페이지 스트레스 테스트 1편 개념과 목표 지표 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7c8c"/>
      <stop offset="0.5" stop-color="#22b8cf"/>
      <stop offset="1" stop-color="#5ec6d6"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <rect x="1020" y="36" width="100" height="40" rx="20" fill="#0e2630" stroke="#0a7c8c" stroke-width="2"/>
  <text class="ko" x="1070" y="63" font-size="20" font-weight="800" fill="#5ec6d6" text-anchor="middle">1 / 6</text>

  <text class="ko" x="80" y="112" font-size="44" font-weight="800" fill="#f8fafc">홈페이지 스트레스 테스트 <tspan fill="#5ec6d6">개념과 지표</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">무엇을·왜·어떤 지표로 재는가 — 테스트 종류와 목표 지표 먼저</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#5ec6d6">처리량 (RPS)</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">초당 처리한 요청 수</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#b3b4e6">p95 응답시간</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">평균 아닌 백분위수</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a1620" stroke="#a63d5c" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#e6899f">에러율</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">무너지는 첫 신호</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 도구를 켜기 전에 목표 지표(SLO)부터 정한다</text>
</svg>
