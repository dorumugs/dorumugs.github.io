<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="홈페이지 스트레스 테스트 2편 k6 부하 시나리오 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160e26"/>
      <stop offset="1" stop-color="#2a1b42"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b7ba8"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <rect x="1020" y="36" width="100" height="40" rx="20" fill="#2a1642" stroke="#7c3aed" stroke-width="2"/>
  <text class="ko" x="1070" y="63" font-size="20" font-weight="800" fill="#c084fc" text-anchor="middle">2 / 6</text>

  <text class="ko" x="80" y="112" font-size="44" font-weight="800" fill="#f8fafc">홈페이지 스트레스 테스트 <tspan fill="#c084fc">k6 부하</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#b8a9d0">stages 만 바꾸면 부하·스파이크·소크 — 셋을 스크립트로</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#241640" stroke="#7c3aed" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#c084fc">부하</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#d4cbe1">서서히 올려 유지</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#33203a" stroke="#a63d8c" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#e68fd0">스파이크</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#d4cbe1">순식간에 급증·급감</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a2440" stroke="#5b7ce0" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#8fb0f0">소크</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#d4cbe1">수 시간 오래 유지</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#8b7ba8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#8b7ba8" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#7c6f94">KayserDocs · thresholds 로 통과 기준을 스크립트에 박는다</text>
</svg>
