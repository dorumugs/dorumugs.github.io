<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="홈페이지 스트레스 테스트 4편 백엔드 DB 병목 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#251506"/>
      <stop offset="1" stop-color="#3a2610"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <rect x="1020" y="36" width="100" height="40" rx="20" fill="#2f1e08" stroke="#d97706" stroke-width="2"/>
  <text class="ko" x="1070" y="63" font-size="20" font-weight="800" fill="#fbbf24" text-anchor="middle">4 / 7</text>

  <text class="ko" x="80" y="112" font-size="44" font-weight="800" fill="#f8fafc">홈페이지 스트레스 테스트 <tspan fill="#fbbf24">백엔드 병목</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#c0a878">부하를 걸며 서버 안쪽을 본다 — 어느 자원·어느 쿼리가 막히나</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2f1e08" stroke="#d97706" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fbbf24">자원 포화</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#e1d4bb">CPU·메모리·대기 큐</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a2410" stroke="#a68a3d" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#e6cf8f">느린 쿼리·N+1</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#e1d4bb">EXPLAIN 으로 잡기</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#2a1810" stroke="#c06a2d" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#f0a878">커넥션 풀</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#e1d4bb">고갈·미반납 주의</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#8a7550">KayserDocs · 증상은 부하 도구가, 원인은 서버 모니터링이 알려준다</text>
</svg>
