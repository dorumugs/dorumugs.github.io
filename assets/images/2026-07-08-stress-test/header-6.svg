<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="홈페이지 스트레스 테스트 6편 보안 가용성 종합 체크리스트 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset="1" stop-color="#122140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <rect x="1020" y="36" width="100" height="40" rx="20" fill="#0e1f3a" stroke="#2563eb" stroke-width="2"/>
  <text class="ko" x="1070" y="63" font-size="20" font-weight="800" fill="#60a5fa" text-anchor="middle">6 / 7</text>

  <text class="ko" x="80" y="112" font-size="44" font-weight="800" fill="#f8fafc">홈페이지 스트레스 테스트 <tspan fill="#60a5fa">보안·가용성</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a8c8">악의의 부하는 잘 처리가 아니라 잘 차단 — 그리고 종합 체크리스트</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e1f3a" stroke="#2563eb" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#60a5fa">Rate Limit</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#c4d4e1">상한 넘으면 429</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#12243a" stroke="#3d7ac0" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#78b0f0">DDoS 완화</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#c4d4e1">CDN·WAF 앞단</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#122a2a" stroke="#3da68a" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7de6c0">취약점 스캔</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#c4d4e1">OWASP ZAP</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#5f7396">KayserDocs · 6개 층을 숫자로 최종 점검하고 배포 버튼을 누른다</text>
</svg>
