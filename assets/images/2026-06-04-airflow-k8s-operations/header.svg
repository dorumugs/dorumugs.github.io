<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Airflow on K8s 운영 — git-sync 로그 영속화 모니터링 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="0.5" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">Airflow on K8s 운영 <tspan fill="#fdba74">(4/5)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">git-sync · 로그 영속화 · 모니터링 · 스케일과 장애 패턴</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2b1608" stroke="#ea580c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#fdba74">git-sync</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">DAG 자동 동기화</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a1a0c" stroke="#f97316" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fed7aa">로그 영속화</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">PVC 또는 원격 S3</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#281c08" stroke="#d97706" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#fcd34d">모니터링</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">Prometheus 메트릭</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Airflow on K8s 5부작 — 4편 운영</text>
</svg>
