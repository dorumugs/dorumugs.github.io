<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="토지거래허가구역 세 낀 집 실거주 유예 절차 — 토허 신청, 소유권 등기, 입주 유예 타임라인 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6264a7"/>
      <stop offset="0.5" stop-color="#0a7c8c"/>
      <stop offset="1" stop-color="#217346"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">토허구역 '세 낀 집', <tspan fill="#b3b4e6">살 수 있나</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">실거주 의무 유예 — 누가 되고, 언제까지 입주해야 하나</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="215" y="282" font-size="22" font-weight="800" fill="#b3b4e6">토허 신청</text>
    <text x="215" y="316" font-size="16" font-weight="500" fill="#cbd5e1">~2026.12.31</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="600" y="282" font-size="22" font-weight="800" fill="#5ec6d6">소유권 등기</text>
    <text x="600" y="316" font-size="16" font-weight="500" fill="#cbd5e1">허가 후 4개월 내</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="985" y="282" font-size="22" font-weight="800" fill="#7dd3a8">실입주</text>
    <text x="985" y="316" font-size="16" font-weight="500" fill="#cbd5e1">최대 2028.5.11</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 무주택·비거주 1주택만, 입주 시점만 미뤄주는 제도</text>
</svg>
