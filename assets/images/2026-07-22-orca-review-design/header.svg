<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Orca 에서 diff 줄에 코멘트를 달아 에이전트에 되돌리고 Design Mode 로 UI 를 클릭해 고치는 결과 검수 흐름 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#6264a7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">결과 <tspan fill="#c4b5fd">검수</tspan> — diff·Design Mode</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">diff 줄에 코멘트를 달아 되돌리고, UI 는 클릭해서 에이전트에 넘겨요</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#1e1836" stroke="#8b5cf6" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#c4b5fd">diff 코멘트</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">줄마다 지적 → 반영</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#b3b4e6">Design Mode</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">클릭 → HTML·CSS·샷</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0f2537" stroke="#38bdf8" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7dd3fc">commit</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">Orca 안에서 바로</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Orca 시리즈 3편 — 사람이 검수하는 자리</text>
</svg>
