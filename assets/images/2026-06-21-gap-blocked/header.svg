<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="1주택자 갭투자가 막힌 세 개의 빗장 — 세입자 전세대출 금지, 토지거래허가구역 실거주 의무, 처분조건부 주담대 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7c8c"/>
      <stop offset="0.5" stop-color="#6264a7"/>
      <stop offset="1" stop-color="#217346"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">1주택자 갭투자, 왜 <tspan fill="#5ec6d6">막혔나</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">대출과 6·27 · 10·15 대책이 채운 세 개의 빗장</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="320" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="250" y="284" font-size="22" font-weight="800" fill="#5ec6d6">빗장 ① 세입자</text>
    <text x="250" y="318" font-size="16" font-weight="500" fill="#cbd5e1">조건부 전세대출 금지</text>
    <rect x="440" y="236" width="320" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="284" font-size="22" font-weight="800" fill="#b3b4e6">빗장 ② 매물</text>
    <text x="600" y="318" font-size="16" font-weight="500" fill="#cbd5e1">토허구역 2년 실거주</text>
    <rect x="790" y="236" width="320" height="118" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="950" y="284" font-size="22" font-weight="800" fill="#7dd3a8">빗장 ③ 내 대출</text>
    <text x="950" y="318" font-size="16" font-weight="500" fill="#cbd5e1">처분조건 · 6억 한도</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 자금줄·매물·내 대출, 세 곳이 동시에 잠겼다</text>
</svg>
