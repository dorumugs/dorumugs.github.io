<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="AWS DMS 와 CDC 로 MSSQL 무중단 컷오버 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="108" font-size="44" font-weight="800" fill="#f8fafc">DMS + CDC <tspan fill="#fbbf24">무중단 컷오버</tspan></text>
  <text class="ko" x="82" y="152" font-size="22" font-weight="500" fill="#94a3b8">풀로드 후 변경분 따라잡기 · 다운타임 분 단위 이하 (3/5)</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#5ec6d6">CDC</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">트랜잭션 로그 캡처</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#2a1c08" stroke="#f59e0b" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#fbbf24">AWS DMS</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">Full Load + CDC</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7dd3a8">AWS RDS</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">latency 0 → 전환</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · MSSQL → AWS RDS 마이그레이션 시리즈</text>
</svg>
