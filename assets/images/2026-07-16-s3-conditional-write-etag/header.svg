<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="S3 조건부 쓰기 If-Match ETag 로 GET 과 PUT 사이 경쟁 구간을 원자적으로 닫는 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#0d2321"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="43" font-weight="800" fill="#f8fafc">조건부 쓰기로 <tspan fill="#5eead4">경쟁 구간</tspan>까지 닫기</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">PUT 에 If-Match(ETag) 를 실어 저장 계층이 원자적으로 판정</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="260" height="118" rx="16" fill="#0d2321" stroke="#0d9488" stroke-width="3"/>
    <text x="220" y="280" font-size="21" font-weight="800" fill="#5eead4">ETag 캡처</text>
    <text x="220" y="312" font-size="16" font-weight="500" fill="#cbd5e1">로드 응답 헤더에서</text>
    <rect x="470" y="236" width="260" height="118" rx="16" fill="#0d2321" stroke="#0d9488" stroke-width="3"/>
    <text x="600" y="280" font-size="21" font-weight="800" fill="#5eead4">PUT If-Match</text>
    <text x="600" y="312" font-size="16" font-weight="500" fill="#cbd5e1">프리컨디션 동봉</text>
    <rect x="850" y="236" width="260" height="118" rx="16" fill="#1e1a12" stroke="#d97706" stroke-width="3"/>
    <text x="980" y="280" font-size="21" font-weight="800" fill="#fbbf24">불일치 → 412</text>
    <text x="980" y="312" font-size="16" font-weight="500" fill="#cbd5e1">저장 차단 · 복구</text>
  </g>

  <line x1="355" y1="295" x2="463" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="735" y1="295" x2="843" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 백엔드 없이 동시 편집 지키기 (2)</text>
</svg>
