<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="프롬프트 인젝션을 입력단에서 걸러내는 다층 필터 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.5" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">인젝션 입력단 방어 <tspan fill="#818cf8">(2/3)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">휴리스틱 필터·구조적 분리·분류기·허니토큰 — 다층 탐지</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#14142e" stroke="#4f46e5" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#818cf8">구조적 분리</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">지시와 데이터 분리</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#14142e" stroke="#6366f1" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#a5b4fc">탐지 필터</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">휴리스틱·분류기 탐지</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#14142e" stroke="#818cf8" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#c7d2fe">허니토큰</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">미끼로 유출 감지</text>
  </g>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 입력단에서 인젝션 걸러내기</text>
</svg>
