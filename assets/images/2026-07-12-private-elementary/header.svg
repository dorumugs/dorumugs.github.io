<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="서울 사립초 38개교, 2026학년도 평균 경쟁률 8.2대 1, 1인당 최대 3개교 지원 현황과 사립초 고르기 4기준 배너" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1a2438"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1c1408"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="1" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#0a1a10"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- title block -->
  <text x="70" y="86" fill="#e2e8f0" font-size="44" font-weight="700">서울 사립초 완전정복</text>
  <text x="72" y="128" fill="#fcd34d" font-size="21" font-weight="500" letter-spacing="2">38개교 리스트 · 학비 · 온라인 추첨 · 고르는 기준</text>

  <!-- stat cards -->
  <rect x="70" y="190" width="220" height="120" rx="12" fill="url(#card1)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="180" y="248" fill="#fcd34d" font-size="40" font-weight="700" text-anchor="middle">38개교</text>
  <text x="180" y="286" fill="#cbd5e1" font-size="17" text-anchor="middle">서울에만 있는 사립초</text>

  <rect x="310" y="190" width="220" height="120" rx="12" fill="url(#card2)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="420" y="248" fill="#7dd3fc" font-size="40" font-weight="700" text-anchor="middle">8.2대 1</text>
  <text x="420" y="286" fill="#cbd5e1" font-size="17" text-anchor="middle">2026학년도 평균 경쟁률</text>

  <rect x="550" y="190" width="220" height="120" rx="12" fill="url(#card3)" stroke="#4ade80" stroke-width="1.2"/>
  <text x="660" y="248" fill="#86efac" font-size="40" font-weight="700" text-anchor="middle">최대 3곳</text>
  <text x="660" y="286" fill="#cbd5e1" font-size="17" text-anchor="middle">1인당 지원 가능 학교 수</text>

  <text x="70" y="356" fill="#94a3b8" font-size="17">정원 3,614명에 29,488명 지원 — 전산 추첨은 유튜브로 생중계됩니다</text>

  <!-- right panel: four criteria -->
  <rect x="850" y="170" width="290" height="210" rx="12" fill="#0b1220" stroke="#155e75" stroke-width="1.5"/>
  <text x="995" y="210" fill="#7dd3fc" font-size="20" font-weight="700" text-anchor="middle">사립초 고르기 4기준</text>
  <text x="995" y="250" fill="#e2e8f0" font-size="17" text-anchor="middle">① 통학 거리와 시간</text>
  <text x="995" y="284" fill="#e2e8f0" font-size="17" text-anchor="middle">② 교육과정 색깔 (영어·IB)</text>
  <text x="995" y="318" fill="#e2e8f0" font-size="17" text-anchor="middle">③ 6년 학비 체력</text>
  <text x="995" y="352" fill="#e2e8f0" font-size="17" text-anchor="middle">④ 중학교 이후 로드맵</text>

  <text x="1140" y="52" fill="#64748b" font-size="16" text-anchor="end">KayserDocs</text>
</svg>
