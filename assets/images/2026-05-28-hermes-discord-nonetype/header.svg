<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Hermes Agent 의 NoneType 에러를 추적해 최신 이미지 교체로 해결한 트러블슈팅 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c026d3"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">Hermes NoneType 트러블슈팅 <tspan fill="#f0abfc">(2/2)</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">'NoneType' object is not iterable — 알려진 버그, 최신 이미지로 해결</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#2a1230" stroke="#c026d3" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#f0abfc">증상</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">봇·크론 같이 멈춤</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1e1533" stroke="#7c3aed" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#c4b5fd">원인</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">스트림 처리 버그</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#171a38" stroke="#4f46e5" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#a5b4fc">해결</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">최신 이미지 교체</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · Hermes Agent 시리즈 2편, 트러블슈팅 편</text>
</svg>
