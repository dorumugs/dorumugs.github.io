<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="문서에서 지식 그래프를 생성하고 유지보수하는 파이프라인 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7c8c"/>
      <stop offset="0.5" stop-color="#6264a7"/>
      <stop offset="1" stop-color="#217346"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- 배경 그래프 장식: 노드와 엣지 -->
  <g opacity="0.35">
    <line x1="880" y1="80" x2="990" y2="130" stroke="#38506e" stroke-width="2"/>
    <line x1="990" y1="130" x2="1100" y2="90" stroke="#38506e" stroke-width="2"/>
    <line x1="990" y1="130" x2="1060" y2="185" stroke="#38506e" stroke-width="2"/>
    <line x1="880" y1="80" x2="930" y2="170" stroke="#38506e" stroke-width="2"/>
    <circle cx="880" cy="80" r="10" fill="#5ec6d6"/>
    <circle cx="990" cy="130" r="13" fill="#b3b4e6"/>
    <circle cx="1100" cy="90" r="8" fill="#7dd3a8"/>
    <circle cx="1060" cy="185" r="9" fill="#5ec6d6"/>
    <circle cx="930" cy="170" r="7" fill="#7dd3a8"/>
  </g>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">문서에서 <tspan fill="#5ec6d6">지식 그래프</tspan> 만들기</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">한 번 뽑고 끝이 아니라, 문서가 바뀌어도 그래프가 따라오게</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0e2630" stroke="#0a7c8c" stroke-width="3"/>
    <text x="215" y="288" font-size="24" font-weight="800" fill="#5ec6d6">추출</text>
    <text x="215" y="320" font-size="16" font-weight="500" fill="#cbd5e1">LLM + 스키마 검증</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#1d1d33" stroke="#6264a7" stroke-width="3"/>
    <text x="600" y="288" font-size="24" font-weight="800" fill="#b3b4e6">정규화</text>
    <text x="600" y="320" font-size="16" font-weight="500" fill="#cbd5e1">엔티티 통합 · alias</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#11291f" stroke="#217346" stroke-width="3"/>
    <text x="985" y="288" font-size="24" font-weight="800" fill="#7dd3a8">멱등 업서트</text>
    <text x="985" y="320" font-size="16" font-weight="500" fill="#cbd5e1">문서 단위 교체 + 출처</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 유지보수가 쉬운 지식 그래프 파이프라인</text>
</svg>
