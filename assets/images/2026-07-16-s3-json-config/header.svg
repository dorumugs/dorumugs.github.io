<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="백엔드 없이 S3 JSON 설정 파일을 안전하게 저장하고 보여주기 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0369a1"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="44" font-weight="800" fill="#f8fafc">백엔드 없이 <tspan fill="#38bdf8">S3 JSON</tspan> 을 설정 파일로</text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">"누군 수정됨, 누군 안 보임" 을 없애고 잘 저장·잘 보이게</text>

  <g class="ko" text-anchor="middle">
    <rect x="90"  y="236" width="250" height="118" rx="16" fill="#0c2233" stroke="#0369a1" stroke-width="3"/>
    <text x="215" y="280" font-size="22" font-weight="800" fill="#38bdf8">캐시 고치기</text>
    <text x="215" y="312" font-size="16" font-weight="500" fill="#cbd5e1">Cache-Control · 포인터</text>
    <rect x="475" y="236" width="250" height="118" rx="16" fill="#0c2233" stroke="#0369a1" stroke-width="3"/>
    <text x="600" y="280" font-size="22" font-weight="800" fill="#38bdf8">덮어쓰기 막기</text>
    <text x="600" y="312" font-size="16" font-weight="500" fill="#cbd5e1">If-Match ETag</text>
    <rect x="860" y="236" width="250" height="118" rx="16" fill="#0d2321" stroke="#0d9488" stroke-width="3"/>
    <text x="985" y="280" font-size="22" font-weight="800" fill="#5eead4">항상 최신</text>
    <text x="985" y="312" font-size="16" font-weight="500" fill="#cbd5e1">모두 같은 화면</text>
  </g>

  <line x1="345" y1="295" x2="468" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="295" x2="853" y2="295" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 정적 호스팅으로 만드는 설정 편집 화면</text>
</svg>
