<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="아파트 착공 × 금리 배너 — 전국 아파트 착공의 평년 대비 지수와 금리를 x축을 공유하는 2단 패널로 보여준다">
  <!-- 위 칸의 파란 선은 **실제 값**이다 — assets/realestate/supply.json 의 전국
       평년=100 지수(2011-12~2026-07, 176개월)를 그대로 그렸다. 마지막 점 67.9 도
       실제다. 아래 칸의 금리 선은 모양만 낸 **모식도**이고 실제 값이 아니다
       (ETF 배너의 색띠와 같은 취급). 두 칸을 x축만 공유하게 그린 건 이 화면이
       이중 Y축을 쓰지 않는다는 뜻을 그대로 옮긴 것이다. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#eb6834"/>
    </linearGradient>
    <style>.ko { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }</style>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text class="ko" x="80" y="112" font-size="46" font-weight="800" fill="#f8fafc">아파트 착공 <tspan fill="#6da7ec">×</tspan> <tspan fill="#f0a17c">금리</tspan></text>
  <text class="ko" x="82" y="156" font-size="23" font-weight="500" fill="#94a3b8">지금 삽을 안 뜨면 2~3년 뒤 입주가 마른다 — 시도 16곳을 평년 대비로</text>

