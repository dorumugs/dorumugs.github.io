  <text class="ko" x="80" y="308" font-size="15" font-weight="500" fill="#7c8aa0">결론을 정할 수 있다</text>

  <text class="ko" x="80" y="398" font-size="18" fill="#64748b">KayserDocs · 통계누리 착공 + 한국은행 ECOS · 상관이지 인과가 아니다</text>
</svg>
